th histories, plausibly because its many more parameters are hard to estimate.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Recommends the diagonal matrix (VETS D) and gives the estimability reason (n rather than n(n+1)/2 terms, important on short histories), plus M5 results consistent with the reference."}}, {"code": "NEC37", "text": "The paper recommends estimating VETS with a **diagonal covariance matrix** (VETS D), i.e. assuming errors across series are uncorrelated.\r\n\r\nReasons given:\r\n- **Easier to estimate**, especially on small samples — the full matrix (VETS F) requires estimating $n(n+1)/2$ variance-covariance terms, which quickly exceeds the number of observations (e.g. 1275 parameters for 50 series).\r\n- **Better empirical performance on M5:** VETS D outperformed VETS F on both long and short samples in terms of rMAE and prediction-interval coverage (VETS F produced intervals that were too wide, with high pinball values, due to estimation difficulties).\r\n- **More robust:** the simulation findings (common parameters/initials, e.g. PIC(LS,S,N)) carry over to the diagonal case, and the diagonal assumption avoids overfitting.\r\n\r\nThe only exception noted: if the **pinball measure** is the primary concern and the history is short, VETS D may not be preferred (ETS models had better relative pinball values on short data).", "judge": {"score": 0.5, "invented": 1, "overreach": 0, "reason": "The recommendation, the estimability reason and the M5 support are correct. It adds as the paper's a 'more robust / simulation findings carry over / avoids overfitting' reason and a pinball 'exception' for VETS D, neither of which the reference supports."}}]}, {"text": "In the simulations, is the shrinkage from multi-step estimators beneficial for both ETS and ARIMA models?", "reference": "No. It helps remove redundant ETS parameters (the trend parameter β of ETS(A,A,N) on ETS(A,N,N) data shrinks to zero faster), but for ARIMA it can be damaging: fitting ARIMA(1,1,1) to ETS(A,N,N) data, the multi-step estimators force the AR parameter negative on small samples, worse than MSE_1. When the parameters matter, MSE_1 is preferred.", "marking": "Required: No: the shrinkage helps remove redundant ETS parameters but can damage ARIMA estimates. Not required: the other details of the reference answer. Wrong: saying the shrinkage is beneficial in general (overreach).", "answers": [{"code": "DCPRX", "text": "Not uniformly — it depends on whether the fitted model matches the data-generating process.\r\n\r\n**Beneficial cases:** When a redundant parameter is zero — e.g., fitting ETS(A,A,N) to ETS(A,N,N) or ARIMA(0,1,1) data (β = 0) — multi-step estimators shrink \\(\\hat{\\beta}\\) toward zero and estimate it more efficiently than MSE₁ on small samples.\r\n\r\n**Harmful case:** When an over-parameterised ARIMA(1,1,1) is fitted to ETS(A,N,N) data, multi-step estimators push \\(\\hat{\\phi}_1\\) toward negative values and produce worse parameter estimates than MSE₁.\r\n\r\nSo the benefit is not specific to ETS vs. ARIMA per se, but to whether shrinkage removes a truly redundant parameter versus distorts a needed one.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says the shrinkage is not uniformly beneficial: it removes the redundant ETS trend parameter but pushes the ARIMA(1,1,1) AR parameter negative, worse than MSE_1. The closing reframing is the assistant's own interpretation and does not contradict the required content."}}, {"code": "9J9QP", "text": "No — it differs by model family:\r\n\r\n- **ETS:** Beneficial for redundant parameters. When a wrong ETS model was used (e.g., ETS(A,A,N) on level data), the unnecessary trend parameter β shrank to zero faster than with MSE₁.\r\n- **ARIMA:** Potentially damaging. Wrong parameters were emphasized rather than removed — e.g., the AR parameter of ARIMA(1,1,1) was forced negative on small samples instead of shrinking to zero, making misspecification worse.\r\n\r\nSo shrinkage helps ETS remove redundant components but can harm ARIMA by distorting parameters.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Correctly says no: the shrinkage helps remove redundant ETS parameters but can damage ARIMA estimates, with the AR parameter forced negative on small samples."}}]}, {"text": "Does the paper show that monitoring forecast errors detects changes faster than the Raw CUSUM for any kind of data and change?", "reference": "No. It shows this in simulations of specific scenarios: a mean change and a trend change in seasonal data with ARMA errors, and a change in the autoregressive parameter of AR(1) errors in quarterly seasonal data (with simpler structures in supplementary simulations). All simulated data have an ARMA error structure, normal innovations unless otherwise specified, and a training sample of 300 in the principal simulations. The applications have no Raw CUSUM comparison.", "marking": "Required: no; the result is shown only for the simulated scenarios. Also correct: the scenarios are a mean change and a trend change in seasonal data with ARMA errors, and a change in the autoregressive parameter of AR(1) errors in quarterly seasonal data, with simpler structures in supplementary simulations; all simulated data have an ARMA error structure and normal innovations unless otherwise specified; a training sample of 300, or 300 and 200; the applications have no Raw CUSUM comparison. Not required: the list of scenarios and conditions. Wrong: generalising beyond the simulated scenarios.", "answers": [{"code": "JNRM3", "text": "No. The paper shows faster detection for the specific scenarios tested (mean/trend changes in seasonal data, AR parameter changes), but does not claim universality. The theory requires assumptions on the forecasting model, which don't always hold — ETS(A,N,N) adapting to mean changes is one counterexample.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says no, and that the result holds only for the specific scenarios tested (mean and trend changes in seasonal data, AR parameter changes). It does not generalise."}}, {"code": "QTU3P", "text": "No. The evidence is simulation-based and limited to specific cases: seasonal ARMA data with mean, trend, or AR-parameter changes, and non-seasonal AR/ARMA data with mean or variance changes. There is one exception even there—an AR(1) variance change where Raw CUSUM had lower ADD. The paper does not establish the claim for arbitrary data or change types.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says no, and that the evidence is simulation-based and limited to specific scenarios, consistent with the listed scenarios and the simpler supplementary structures."}}]}, {"text": "What forecast accuracy (for example RMSE) did each estimator achieve in the simulation experiments?", "reference": null, "marking": "Required: says the authors do not report this (any wording). Wrong: giving an answer as the authors'.", "answers": [{"code": "FCPRX", "text": "The paper does not report forecast accuracy (RMSE or other error measures) for the simulation experiments. The simulations report only the distributions of estimated parameters (boxplots in [location]), not out-of-sample forecast errors. Accuracy measures are reported only for the two empirical applications (temperature and Air Passengers data).", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says the paper does not report forecast accuracy for the simulations, as required for this absent question."}}, {"code": "93CQ4", "text": "The paper doesn't report forecast accuracy (RMSE, MAE, etc.) for the simulation experiments. [location] evaluates only **parameter estimation bias and dispersion** via boxplots of estimated parameters across the 500 replications — not out-of-sample forecast errors.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says the paper does not report forecast accuracy for the simulation experiments, as required for this absent question."}}]}, {"text": "In the illustration with data from an ARMA(1,1) model, where was the change, what training size was used, and how long after the change did the mean detector signal it?", "reference": "The change in mean is at time point 400 and the detector uses m = 300. The mean detector D_μ(m,k) crossed its threshold 19 time points after the change (at time 419).", "marking": "Required: 19 time points after the change. Also correct: the change in mean at time point 400; m = 300; the signal at time 419. Not required: the change point, m, the time 419, and the ARMA parameters (λ = 0, φ = −0.8, θ = 0.2).", "answers": [{"code": "3Q73N", "text": "Change at time point 400; training size m = 300; the mean detector D_μ signalled 19 time points after the change.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Gives the required 19 time points after the change, plus the correct change point (400) and m = 300."}}, {"code": "3QDTQ", "text": "In the [location] illustration: the mean change was at time point 400, the training (Phase I) size was m = 300, and the mean detector signalled 19 time points after the change.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Gives the required 19 time points after the change, plus the correct change point (400) and m = 300."}}]}, {"text": "How is the Geometric Trace Mean Squared Error (GTMSE) defined, and how is it derived?", "reference": "GTMSE is the sum over horizons j = 1, …, h of the logarithms of the in-sample mean squared j-step-ahead errors. It is derived from the Generalised Variance of the General Predictive Likelihood by setting the off-diagonal elements of the covariance matrix of the 1- to h-step errors to zero, so that the determinant is the product of the variances.", "marking": "Required: the definition (the sum over horizons 1 to h of the logarithms of the in-sample mean squared j-step-ahead errors) and the derivation (from the Generalised Variance of the General Predictive Likelihood, by setting the off-diagonal covariances of the 1- to h-step errors to zero, so that the determinant is the product of the variances).", "answers": [{"code": "J744K", "text": "**Definition:**\r\n$$GTMSE = \\sum_{j=1}^{h} \\log \\left( \\frac{1}{T-h} \\sum_{t=1}^{T-h} e_{t+j|t}^2 \\right)$$\r\n— the sum of the logarithms of the mean squared errors across horizons 1 to \\(h\\).\r\n\r\n**Derivation:** Start from the General Predictive Likelihood, whose concentrated log-likelihood is\r\n$$l_{GPL_h} = -\\frac{T-h}{2}\\left( h \\log(2\\pi e) + \\log|\\hat{\\Sigma}| \\right).$$\r\nGTMSE is obtained by imposing a **diagonal restriction** on the multi-step error covariance matrix \\(\\hat{\\Sigma}\\) — setting all covariances between errors of different horizons to zero — and applying logarithmic scaling. This gives:\r\n$$GTMSE \\propto \\sum_{j=1}^{h} \\log(s_j^2) = h \\log(s_1^2) + \\sum_{j=2}^{h} \\log\\left(1 + \\sum_{i=1}^{j-1} \\hat{c}_i^2\\right),$$\r\nusing \\(\\sigma_h^2 = \\sigma_1^2\\left(1 + \\sum_{j=1}^{h-1} c_j^2\\right)\\).\r\n\r\n**Purpose:** the diagonal restriction moderates the shrinkage that full multi-step losses impose on the \\(\\hat{c}_j\\), making GTMSE's shrinkage milder than MSE_h, TMSE and MSCE. Note [location]: the restriction is artificial, since off-diagonal covariances are nonzero whenever \\(c_j \\neq 0\\).", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Correct definition and derivation: GPL covariance determinant with a diagonal restriction (off-diagonal covariances set to zero), giving the sum of log variances."}}, {"code": "FA9W3", "text": "**Definition** ([location] in the paper):\r\n\r\n$$\\mathrm{GTMSE} = \\sum_{j=1}^{h} \\log\\left(\\frac{1}{T-h}\\sum_{t=1}^{T-h} e_{t+j|t}^2\\right)$$\r\n\r\n**Derivation:** It comes from the General Predictive Likelihood (GPL). GPL maximization is equivalent to minimizing the determinant of the h×h covariance matrix of 1- to h-step-ahead forecast errors (the \"Generalised Variance\"). If all off-diagonal covariances in that matrix are set to zero (an artificial restriction, since they are nonzero in reality), the determinant becomes the product of the diagonal variances. Taking logs converts the product into a sum, giving GTMSE — i.e., the sum of log variances of each horizon's errors.\r\n\r\nBecause of the log transformation, the one-step-ahead variance is balanced against the $\\hat{c}_j^2$ terms, so GTMSE retains shrinkage but much milder than MSE_h, TMSE, or MSCE.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Correct definition (sum over horizons of the logs of in-sample mean squared j-step errors) and correct derivation from the Generalised Variance of the GPL with off-diagonal covariances set to zero, so the determinant is the product of variances."}}]}, {"text": "In simulation experiment 1, which variable had the largest effect on the bias of the point forecasts, which had the smallest, and in what order did the others fall?", "reference": "All five variables increase the bias (the percentage difference between the conditional expectation and the point forecast) (all regression coefficients positive, 99.9% intervals excluding zero). The damping parameter φ has the largest effect (6.167), followed by β (3.739), the forecast horizon (3.656) and the scale σ (2.755); α has the smallest (1.578). All variables were scaled to lie between 0 and 1.", "marking": "Required: φ (the damping parameter) has the largest effect and α the smallest; the others in the order β, then the forecast horizon, then the scale σ. An answer that puts σ before the horizon earns partial credit (the authors' own summary names the error variance right after β). Not required: the coefficient values, the confidence level, the scaling of the variables. Wrong: any other variable named as largest or smallest.", "answers": [{"code": "VJYWF", "text": "Based on the Box-Cox odds regression estimates (scaled predictors):\r\n\r\n1. **φ (damping parameter)** — largest effect (estimate 6.167)\r\n2. **Horizon** (3.656)\r\n3. **β (trend smoothing)** (3.739) — essentially tied with horizon\r\n4. **σ (scale)** (2.755)\r\n5. **α (level smoothing)** — smallest effect (1.578)\r\n\r\nSo: φ > horizon ≈ β > σ > α.", "judge": {"score": 0.5, "invented": 0, "overreach": 0, "reason": "Correctly names φ as largest and α as smallest, but ranks the horizon ahead of β even though its own quoted coefficients (3.656 against 3.739) show the reverse. The middle order is therefore imprecise."}}, {"code": "VP9N7", "text": "Largest to smallest effect: dampening parameter φ, trend smoothing β, forecast horizon h, scale σ, level smoothing α.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Gives the exact required order: φ, β, forecast horizon, σ, α."}}]}, {"text": "Does the electric vehicle charging example show that the selected model forecasts the holdout more accurately than a model with the Normal distribution?", "reference": "No accuracy measure is reported for the holdout. The example shows that the selected ETS(M,Md,M) model with the Gamma distribution has a lower AICc than an additive ETS(A,Ad,A) model, and that on the first 49 observations the Normal model gives a 95% prediction interval that covers negative values while the Gamma model gives a reasonable one that does not cover negative values.", "marking": "Required: No; no accuracy measure for the holdout is reported. Also correct: what the example does show: the selected ETS(M,Md,M) model with the Gamma distribution has a lower AICc than an additive ETS(A,Ad,A) model, and on the first 49 observations the Normal model's 95% prediction interval covers negative values while the Gamma model's is reasonable and does not. Wrong (overreach): claiming an accuracy advantage on the holdout.", "answers": [{"code": "JCFMJ", "text": "Not exactly. The example shows the Normal-distribution model gives an unrealistic prediction interval covering negative values on low-volume data, while the Gamma model gives a reasonable positive interval. It does not report holdout accuracy measures comparing forecast errors.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "States that no holdout accuracy measures are reported and correctly describes the Normal interval covering negative values against the reasonable Gamma interval."}}, {"code": "RHUH4", "text": "The paper doesn't report holdout forecast accuracy for the EV example — only in-sample AICc (6398.57 Gamma vs 6418.296 Normal) and strictly positive 95% prediction intervals on the low-volume subsample. So the example shows better fit and positivity, not demonstrated holdout accuracy.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Correctly says no holdout accuracy is reported and that the example shows only a lower AICc and positive prediction intervals on the low-volume subsample. No accuracy advantage is claimed."}}]}, {"text": "How long did estimation with GTMSE take compared with the conventional MSE_1?", "reference": null, "marking": "Required: says the authors do not report this (any wording). Wrong: giving an answer as the authors'.", "answers": [{"code": "JKTMY", "text": "The paper does not report computation times for GTMSE versus MSE_1.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says the paper does not report computation times, as required for this absent question."}}, {"code": "UC7TR", "text": "The paper contains no information about computation time for GTMSE versus MSE₁ — no runtimes are reported in the evidence or artefacts.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says no computation times are reported, as required for this absent question."}}]}, {"text": "What evidence supports the claim that using cross-sectional information improves forecast accuracy on the M5 data, and what limitations of this evidence, apart from statistical significance, does the paper itself state?", "reference": "VETS D has the lowest overall geometric mean and median rMAE of the five models on both long and short histories, and the authors say the VETS models are almost always better than Naïve and than the univariate ETS models on long histories, and typically better than Naïve on short ones. Limitation the authors state: the benefit assumes that the series are correctly grouped.", "marking": "Required: VETS D has the lowest overall geometric mean and median rMAE of the five models on both long and short histories. Also correct: the VETS models are almost always better than Naïve and than the univariate ETS models on long histories, and typically better than Naïve on short ones; the differences in the MCB test are not statistically significant (excluded by the question, but not wrong). Not required: any limitation. Acceptable limitations: the benefit assumes the series are correctly grouped; it assumes the classification of the series into seasonal or non-seasonal and trended or non-trended is correct; the evidence is one data set of 69 series in 11 groups, each evaluated on a single 12-month holdout; models with a trend are not analysed. Limitations: correct if the answer gives limitations from this list or says the authors state none. Wrong: presenting as the authors' a limitation not in this list (also overreach).", "answers": [{"code": "M3QFF", "text": "**Evidence:**\r\n- VETS D — which estimates from the whole group — has the lowest geometric mean and median rMAE of the five models on both long and short histories (0.894/0.934 long, 0.936/0.974 short), beating the three univariate ETS models.\r\n- The selection procedure most often chose PIC(LS,S,N) (6 of 11 groups), i.e., restrictions that pool information across series, and the authors attribute the gains mainly to shared seasonal initial values and smoothing parameters.\r\n\r\n**Limitations stated (apart from significance):**\r\n- Evidence is a single monthly data set of 69 series in 11 groups, each with one 12-month holdout.\r\n- Seasonality/trend classification and departmental grouping rely on `adam` and are assumed correct.\r\n- No trend-component models were analysed.\r\n- No experiment on M5 compares VETS with and without the cross-series restrictions directly — the attribution to shared parameters/initial values is abductive, not tested.\r\n- Robustness of the simulation findings outside the simulated settings is untested; the M5 evidence alone does not establish that cross-sectional information helps generally.", "judge": {"score": 0.5, "invented": 1, "overreach": 1, "reason": "Gives the required evidence (VETS D lowest geometric mean and median rMAE on both long and short histories) and three acceptable limitations. It also presents as the authors' two limitations not in the list (no direct with/without-restrictions comparison on M5; untested robustness of the simulation findings), which the guide marks wrong and overreach."}}, {"code": "TX9RN", "text": "**Evidence supporting the claim:**\r\n\r\n- VETS D (geometric mean rMAE 0.894, median 0.878) and VETS F (0.906 / 0.894) beat all univariate ETS benchmarks on long histories — ETS LN (0.917 / 0.959), ETS (ADAM) (0.955 / 0.997), and ETS (0.933 / 0.975) — with Naïve as benchmark.\r\n- On short histories, VETS D (0.979 / 0.974) again outperformed ETS models, some of which were worse than Naïve.\r\n- The automatically selected PIC restrictions were predominantly LS,S,N — common level/seasonal smoothing parameters and common initial seasonal indices — indicating the cross-series restrictions drive the gains.\r\n- VETS D also achieved near-nominal 95% coverage (0.947 long, 0.938 short) vs. ETS models falling below 95%.\r\n\r\n**Limitations the paper itself states (apart from statistical significance):**\r\n\r\n- **Assumes correct grouping:** benefits \"assume that the data is correctly grouped\" — cross-sectional estimation helps only if series are truly homogeneous.\r\n- **Pinball trade-off on short data:** VETS D had worse relative pinball values than ETS models on short histories, so the accuracy gain comes at the cost of less sharp intervals.\r\n- **VETS F estimation difficulties:** the full covariance model produced too-wide intervals (coverage 0.982, high pinball), limiting its practical use.\r\n- **Small non-seasonal sample:** only 13 non-seasonal series in 4 groups, making conclusions for non-seasonal data unreliable.\r\n- **Aggregation choice:** results are for monthly department-store aggregates; granularity choice (e.g. weekly/daily) may affect findings — noted as future work.", "judge": {"score": 0.5, "invented": 1, "overreach": 1, "reason": "Evidence essentially matches (VETS D best on long and short histories) and the correct-grouping limitation is acceptable. It also presents as the authors' four limitations not in the list (pinball trade-off, VETS F estimation difficulties, small non-seasonal sample, aggregation choice), which the guide marks wrong and overreach."}}]}, {"text": "What WRMSSE, the error measure of the M5 competition, did VETS D and VETS F achieve on the M5 data?", "reference": null, "marking": "Required: says the authors do not report this (any wording). Wrong: giving an answer as the authors'.", "answers": [{"code": "3TK3E", "text": "The paper does not report WRMSSE. The M5 evaluation uses rMAE, rRMSE, GMRAE, rPinballU/L and coverage — not the M5 competition's WRMSSE — so those values are not available from this document.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Correctly says the paper does not report WRMSSE."}}, {"code": "73UF4", "text": "The paper does not report WRMSSE. It uses rMAE, rRMSE, GMRAE, coverage and pinball values with Naïve forecasts as the benchmark — not the M5 competition's WRMSSE measure.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Correctly says the paper does not report WRMSSE."}}]}, {"text": "On seasonal series, does CES outperform every seasonal ETS model on every error measure?", "reference": "No. On the 2,053 seasonal series CES has the lowest mean and median RMSSE and MASE and the lowest median MSIS, but not the lowest mean MSIS: ETS(M,Md,M) ranks first (1.934 against 2.188 for CES), and ETS(A,N,A), ETS(A,Ad,A) and ETS(M,M,M) are also below CES on mean MSIS.", "marking": "Required: no; CES does not have the lowest mean MSIS. Not required: which models are lower on mean MSIS (ETS(M,Md,M) lowest at 1.934 against 2.188 for CES; ETS(A,N,A), ETS(A,Ad,A) and ETS(M,M,M) also lower); that CES has the lowest mean and median RMSSE and MASE and the lowest median MSIS; the number of series (2,053). Wrong: saying CES outperforms every seasonal ETS model on every measure (overreach).", "answers": [{"code": "NYXNV", "text": "No. On the seasonal subset, CES has the best RMSSE and MASE, but not the best MSIS: ETS(M,Md,M) has lower mean MSIS (1.934 vs 2.188), while CES has the best median MSIS.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says no: CES does not have the lowest mean MSIS, with ETS(M,Md,M) lower at 1.934 against 2.188, while CES leads on median MSIS."}}, {"code": "FVV7C", "text": "No — not on **every** measure. On the 2,053 seasonal series, CES beats each seasonal ETS model on mean and median RMSSE and MASE, and on median MSIS — but **not on mean MSIS**, where it is worse than every seasonal ETS model:\r\n\r\n| Comparison model | CES mean MSIS | Model mean MSIS |\r\n|---|---|---|\r\n| ETS(A,N,A) | 2.188 | 2.037 |\r\n| ETS(A,Ad,A) | 2.188 | 2.155 |\r\n| ETS(M,M,M) | 2.188 | 2.153 |\r\n| ETS(M,Md,M) | 2.188 | 1.934 |\r\n\r\nSo CES wins on 5 of 6 measures against each seasonal ETS model; mean MSIS is the consistent exception.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says no, with mean MSIS as the exception, and names the four seasonal ETS models below CES, matching the reference (1.934 against 2.188 for ETS(M,Md,M))."}}]}, {"text": "In the illustration with a variance change, which forecasting model was used and how long after the change did the detector signal it?", "reference": "The data have a trend and a variance change at time point 400. An ETS(A,A,N) model was used, with prediction intervals of ±2 standard errors. The squared-error detector D_ξ(m,k), with m = 300, reached its threshold 7 time points after the change.", "marking": "Required: an ETS(A,A,N) model; the detector signals 7 time points after the change. Also correct: data with a trend and a variance change at time point 400; the squared-error detector D_ξ(m,k) with m = 300. Not required: prediction intervals of ±2 standard errors, and the other details.", "answers": [{"code": "FKUHA", "text": "The illustration used an **ETS(A,A,N)** model (Holt's linear trend, additive error) on data with a trend and a variance change at time point 400. The squared-error detector signalled **7 time points** after the change.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Gives the ETS(A,A,N) model and the 7-time-point delay, with correct detail on the trend and the change at time point 400."}}, {"code": "TWRUV", "text": "An ETS(A,A,N) model was used, and the detector D_ξ(m,k) signalled 7 time points after the change.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Gives the ETS(A,A,N) model and the signal 7 time points after the change."}}]}, {"text": "What were the typical (for example median) estimated values of α0 and α1 across the M3 series?", "reference": null, "marking": "Required: says the authors do not report this (any wording). Wrong: giving an answer as the authors'. Values reported for individual series (two M3 series and one M1 series) do not answer it.", "answers": [{"code": "T7WE7", "text": "The paper does not report typical or median estimated $\\alpha_0$ and $\\alpha_1$ values across the M3 series. It only gives the two example estimates: $0.99999+0.99884i$ for series 1664 and $1.48098+1.00346i$ for series 2721.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says the paper does not report typical or median values across the M3 series, and gives the two individual-series estimates only as examples."}}, {"code": "7MDJT", "text": "The paper reports estimated α₀ and α₁ for only **two** M3 series:\r\n\r\n- **Series 1664** (stationary): α₀ = 0.99999, α₁ = 0.99884\r\n- **Series 2721** (trended): α₀ = 1.48098, α₁ = 1.00346\r\n\r\nNo typical or median values across the M3 series are given.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says no typical or median values across the M3 series are given, and presents the two individual-series values as just that."}}]}, {"text": "Under what condition on the complex smoothing parameter does CES become equivalent to ETS(A,N,N), and how do its parameters then relate to the smoothing parameter of simple exponential smoothing?", "reference": "When α1 = 1, CES is equivalent to ETS(A,N,N). With α1 close to 1, α0 − 1 in CES corresponds to α in SES (for example α0 = 1.24 corresponds to α = 0.24); α0 near 1 corresponds to a stationary series (SES α near 0) and α0 near 2 to a random walk.", "marking": "Required: α1 = 1 (imaginary part equal to one); with α1 close to 1, α0 − 1 in CES corresponds to the smoothing parameter α of simple exponential smoothing. Not required: the example α0 = 1.24 ↔ α = 0.24; that α0 near 1 corresponds to a stationary series (α near 0) and α0 near 2 to a random walk.", "answers": [{"code": "EFFH7", "text": "When $\\alpha_1 = 1$, CES reduces to ETS(A,N,N). Then the CES level update uses $(\\alpha_0 - 1)\\varepsilon_t$, so $\\alpha_0 - 1$ corresponds to the SES smoothing parameter $\\alpha$; e.g., $\\alpha_0 = 1.24$ in CES is equivalent to $\\alpha = 0.24$ in SES.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Gives α1 = 1 and that α0 − 1 corresponds to the SES α, with the 1.24 and 0.24 example."}}, {"code": "CR74M", "text": "When **α₁ = 1** (imaginary part equals one), CES is equivalent to ETS(A,N,N), the local level model.\r\n\r\nIt is then simple exponential smoothing with smoothing parameter **α₀ − 1**: the real part α₀ plays the role of the SES smoothing parameter plus one. So for a stationary series, α₀ ≈ 1 (SES parameter ≈ 0); for a random walk, α₀ ≈ 2 (SES parameter ≈ 1).", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Gives α1 = 1 and that α0 − 1 corresponds to the SES smoothing parameter, with the correct stationary and random-walk cases."}}]}, {"text": "On the Air Passengers data, which model and horizon were used, and which estimator gave the most accurate forecasts?", "reference": "A misspecified ETS(A,A,A) model with a 12-month horizon. GTMSE had the lowest RMSE (18.672), MAE (15.005) and ME (8.369); MSE_h was the worst (RMSE 77.194) and the conventional MSE also poor (RMSE 49.423).", "marking": "Required: names GTMSE as the most accurate. Not required: the other details of the reference answer.", "answers": [{"code": "DM4QF", "text": "**Model/horizon:** ETS(A,A,A) (additive error, trend, seasonality — deliberately misspecified since the series is multiplicative), horizon h = 12 (one year).\r\n\r\n**Most accurate:** GTMSE — RMSE 18.672, MAE 15.005, ME 8.369 (all lowest). MSCE was worst among the multi-step estimators (RMSE 22.601); MSE_h was far worse (77.194).", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Names GTMSE as the most accurate, with the ETS(A,A,A) model, 12-step horizon and values matching the reference. The extra detail on other estimators does not contradict the reference."}}, {"code": "VXRQ3", "text": "A misspecified pure additive **ETS(A,A,A)** model (local trend with additive seasonality) was fitted over a **12-month forecast horizon** (12-month holdout).\r\n\r\n**GTMSE** gave the most accurate forecasts: lowest RMSE (18.672), MAE (15.005) and ME (8.369) of the six estimators.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Names GTMSE as the most accurate, with the correct model, horizon and error values."}}]}, {"text": "How did the multi-step estimators behave for multiplicative ETS models in the paper's simulations?", "reference": null, "marking": "Required: says the authors do not report this (any wording). Wrong: giving an answer as the authors'. Also correct: saying that no multiplicative models were simulated, and citing the authors' remark that the findings may extend to some multiplicative cases.", "answers": [{"code": "KMWT3", "text": "The simulations only used **pure additive** models — ETS(A,N,N), ETS(A,A,N), ARIMA(0,1,1), ARIMA(1,1,1). No multiplicative ETS models were simulated.\r\n\r\nMultiplicative models are noted only as an open question: how the shrinkage mechanism extends to them \"remains only partially explored and is not analytically established.\"", "judge": {"score": 1, "invented": 1, "overreach": 0, "reason": "Correctly says no multiplicative ETS models were simulated. It attributes to the paper a quoted remark ('only partially explored and is not analytically established') that does not match the authors' remark given in the guide, so it is flagged as invented."}}, {"code": "WWQQN", "text": "The paper's simulations used **only pure additive ETS models** (ETS(A,N,N), ETS(A,A,N), ETS(A,Ad,N), ETS(A,N,A), ETS(A,A,A)) — no multiplicative ETS models were included in the simulation study.\r\n\r\nThe authors state they \"examine pure additive ETS models only, keeping in mind that the main findings can be extended to some of the multiplicative cases as well.\" So the shrinkage behavior for multiplicative ETS models was not directly tested or demonstrated in the simulations.", "judge": {"score": 1, "invented": 1, "overreach": 0, "reason": "Correctly says no multiplicative models were simulated and cites the authors' remark about extension to some multiplicative cases. It lists ETS(A,Ad,N), ETS(A,N,A) and ETS(A,A,A) as simulated models, which the reference's simulation design does not include, so it is flagged as invented."}}]}, {"text": "Which company provided the electric vehicle charging data?", "reference": null, "marking": "Required: says the authors do not report this (any wording). Wrong: giving an answer as the authors'. A nearby statement, that the data come from a company tracking electricity used by electric vehicles and are under a non-disclosure agreement, does not answer it; saying the company is not named is correct.", "answers": [{"code": "HKVUX", "text": "The paper does not name the company. [location] only says it was “a company that tracks the amount of electricity used by such vehicles,” and the data availability note says the data cannot be shared publicly due to a non-disclosure agreement.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says the company is not named and gives only the nearby description and the non-disclosure agreement, which the marking guide accepts."}}, {"code": "XUMUT", "text": "The paper doesn't say. The dataset is described only as \"511 daily aggregated observations of electricity used by electric vehicles in a geographical area\" and is restricted by a non-disclosure agreement, so the provider is not named.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says the paper does not name the provider and gives no company as the authors' answer."}}]}, {"text": "On the M1, M3 and tourism data, was CES more or less accurate in RMSSE than machine learning methods such as gradient-boosted trees or neural networks?", "reference": null, "marking": "Required: says the authors do not report this (any wording). Wrong: giving an answer as the authors'.", "answers": [{"code": "Y4XPT", "text": "The paper doesn't compare CES with machine learning methods — only with ETS, ARIMA, the Theta method, and the SCUM combinations. No gradient-boosted trees or neural networks appear in the evidence.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says the paper does not compare CES with machine learning methods and gives no result as the authors'."}}, {"code": "CQ4RA", "text": "The paper does not compare CES with gradient-boosted trees or neural networks on M1/M3/tourism, so that comparison cannot be made from its results.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says the paper makes no comparison of CES with gradient-boosted trees or neural networks."}}]}, {"text": "Can the framework detect mean changes when the forecasting model is the ETS(A,N,N) local level model?", "reference": "Generally not. Proposition 3 shows that the expected forecast errors of ETS(A,N,N) return to zero after a mean change whenever α > 0, faster for larger α, so Assumption 2 is not satisfied unless α = 0; a mean change manifests in the forecast errors only if α is small. The framework can still detect variance changes with ETS models, through the squared forecast errors.", "marking": "Required: no, not in general: after a mean change the expected forecast errors of ETS(A,N,N) return to zero when α > 0, so a mean change does not persist in them. Also correct: the return to zero is faster for larger α; the incomplete-adjustment assumption (Assumption 2) holds only if α = 0; a mean change shows in the forecast errors only if α is small; variance changes can still be detected with ETS models through the squared forecast errors. If the expected forecast error is quoted, both forms are correct: δ_μ,m(1 − α)^{s−1}, or δ_μ,m for s = 1 and (λ + δ_μ,m)(1 − Σ_{i=0}^{s−2} α(1−α)^i) − λ(α(1−α)^{s−1} − (1−α)^s) for s ≥ 2. Not required: the formula and the variance-change point. Wrong: saying the framework detects mean changes with ETS models in general.", "answers": [{"code": "ATUTU", "text": "No, not reliably. The paper shows ETS(A,N,N) does not satisfy [location]: after a mean change, its forecasts adapt and the forecast errors return to zero, so there is no persistent mean shift in the errors to detect (unless α=0). It can still detect variance changes via squared forecast errors.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says not reliably: forecast errors return to zero after a mean change so nothing persists unless α = 0, and variance changes remain detectable through squared errors."}}, {"code": "FM9RY", "text": "No. ETS(A,N,N) adapts to mean changes: its expected forecast error after the change is δμ,m(1−α)^(s−1), which decays to zero, so the incomplete-adjustment assumption fails and the mean change does not persist in the errors. Only variance changes remain detectable via the squared-error detector.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says no, gives the accepted formula δ_μ,m(1−α)^(s−1) decaying to zero, the failure of the incomplete-adjustment assumption, and that variance changes remain detectable."}}]}, {"text": "What supports the claim that the shrinkage imposed by multi-step estimators grows with the forecast horizon and weakens with the sample size?", "reference": "Analytically, minimising MSE_h minimises the estimated h-step variance s_1²(1 + Σ ĉ_j²), pushing ĉ_j² towards zero with a strength that grows with h and falls with the sample size T; TMSE and MSCE shrink too, TMSE more weakly because the short horizons weigh in. In the simulations, longer horizons give larger bias and slower convergence for the same sample size, and on large samples the effect is negligible (the estimates for h = 1 and h = 10 look alike). At h = 200 the ARIMA(0,1,1) estimates remain biased and inefficient even at 5,000 observations.", "marking": "Required: the analytical argument: minimising the multi-step loss minimises the estimated h-step variance and pushes ĉ_j² towards zero, more strongly for larger h and smaller sample size T. Not required: the comparison of TMSE and MSCE with MSE_h; the simulation details.", "answers": [{"code": "XTQQ7", "text": "The claim is supported by analytical derivation: multi-step losses minimise the estimated multi-step coefficients \\(\\hat{c}_j^2\\) and one-step variance \\(s_1^2\\), and since \\(\\sigma_h^2 = \\sigma_1^2(1 + \\sum_{j=1}^{h-1} c_j^2)\\), longer horizons impose stronger pressure toward zero. Finite-sample minimisation of these terms yields shrinkage that diminishes as \\(T\\) grows.\r\n\r\nHowever, verification is marked \"unchecked\" in the paper, and the paper itself notes that with large \\(h\\), over-shrinkage toward boundary values can introduce finite-sample bias.", "judge": {"score": 0.5, "invented": 1, "overreach": 0, "reason": "Gives the required analytical argument: minimising the multi-step loss pushes ĉ_j² towards zero, more strongly for larger h and less so as T grows. It then adds that the paper marks verification as 'unchecked', which the reference does not support and which conflicts with the simulation support it describes, so it is treated as an added error and as invented."}}, {"code": "E7KRF", "text": "**Analytical support:**\r\n- The h-step variance contains the sum Σ_{j=1}^{h-1} ĉ_j², which grows with h, so minimizing it forces ĉ_j (and hence parameters) closer to zero as h increases.\r\n- The likelihood decomposition shows the \"bias\" term B_MSEh is weighted by (T−h)/2, so larger T weakens the penalty relative to the data term.\r\n\r\n**Simulation support:**\r\n- Boxplots show parameter distributions more biased and dispersed at h = 200 than h = 10 for the same sample size.\r\n- For the same h, estimates converge to true values as the sample grows from 20 to 5000; at h = 10 the distributions are nearly identical to MSE₁ even on moderate samples.\r\n\r\n**Empirical support:**\r\n- On the temperature data (T = 2016, h = 60), MSE_h's AR(1) shrank to −0.786 while GTMSE/MSCE/GPL stayed near 0.53–0.69 — shrinkage visible at large h relative to sample size.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Gives the analytical argument that minimising the h-step variance term forces ĉ_j towards zero, more strongly with larger h and more weakly with larger T. The simulation points match the reference; the extra empirical detail cannot be checked against the reference and was not counted against it."}}]}, {"text": "What geometric mean and median rMAE (relative to Naïve) did VETS D reach on the daily M5 series?", "reference": null, "marking": "Required: says the authors do not report this (any wording). Wrong: giving an answer as the authors'.", "answers": [{"code": "X7D9T", "text": "The paper does not report results on daily M5 series. The M5 data were **aggregated to monthly frequency** (department-store level, 70 products), so all reported rMAE values — including VETS D's geometric mean 0.894 / median 0.878 (long) and 0.979 / 0.974 (short) — are for **monthly** series, not daily.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says the paper reports no daily M5 results, only monthly aggregates; the monthly figures are offered as context, not as an answer for daily data."}}, {"code": "K479C", "text": "The paper's M5 analysis uses monthly department-level series only; no daily M5 data are analysed, so VETS D's rMAE on daily series is not reported.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says the analysis is monthly only and the daily rMAE for VETS D is not reported."}}]}, {"text": "In simulation experiment 2, does the ETS model with the distribution that generated the data have the lowest mean scaled pinball score on that data?", "reference": "Not necessarily. For example, on Inverse Gaussian data the Inverse Gaussian model (5.221) is beaten by the Gamma (5.192) and Normal (5.204) models, and on Gamma data the Gamma model (5.231) is beaten by the Normal model (5.193). The authors state the differences between the models are typically small and not statistically significant at the 5% level, except for Akram's approach.", "marking": "Required: No (not necessarily), with the point that the matching distribution does not always give the lowest score. Also correct: examples such as, on Inverse Gaussian data, the Inverse Gaussian model (5.221) beaten by the Gamma (5.192), Normal (5.204) and Log-Normal (5.215) models; on Gamma data, the Gamma model (5.231) beaten by the Normal (5.193), Inverse Gaussian (5.224) and Log-Normal (5.224) models; that the differences are typically small and not significant at the 5% level, except for Akram's approach. Not required: specific values. Wrong (overreach): saying the correct distribution always gives the best score.", "answers": [{"code": "CERNH", "text": "No. The paper says the matching distribution does not necessarily perform best, though differences are usually small and not statistically significant.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says no, the matching distribution does not necessarily perform best, and notes the differences are usually small and not significant."}}, {"code": "CQRH9", "text": "No. Checking each column of [location], the true distribution never wins:\r\n\r\n| DGP | Best fixed model (SPS) | True model's SPS |\r\n|---|---|---|\r\n| Normal | Normal (5.255) | 5.255 — tie with Akram? No, Akram 5.110 is lower. So Normal is best *among fixed*, but Akram beats it. |\r\n| Inverse Gaussian | Gamma (5.192) | IG: 5.221 |\r\n| Gamma | Gamma (5.231)... wait, IG 5.224, Gamma 5.231? Actually IG 5.224 < Gamma 5.231. Let me recheck: IG 5.221? No — IG row, Gamma column = 5.192? No. |\r\n\r\nCorrect values from the table:\r\n- **Normal DGP:** Normal 5.255; best is Akram 5.110. True (Normal) is best among the four fixed, but not overall.\r\n- **IG DGP:** IG 5.221; Gamma 5.192 is lower. True distribution loses.\r\n- **Gamma DGP:** Gamma 5.231; Normal 5.193 and IG 5.224 are lower. True distribution loses.\r\n- **Log-Normal DGP:** Log-Normal 9.423; Gamma 9.388 is lower. True distribution loses.\r\n- **Akram DGP:** Akram 5.089 wins (it *is* the DGP).\r\n\r\nSo only for the Akram DGP does the true model win; for the four ETS DGPs, the true distribution never has the lowest SPS.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says no and gives the correct examples from the guide (IG 5.221 beaten by Gamma 5.192; Gamma 5.231 beaten by Normal 5.193 and IG 5.224). The presentation is muddled and some other figures cannot be checked against the reference, but nothing contradicts it."}}]}, {"text": "What share of the holdout observations fell inside the 95% prediction intervals of CES across the M1, M3 and tourism series?", "reference": null, "marking": "Required: says the authors do not report this (any wording). Wrong: giving an answer as the authors'. The statement that all holdout observations of one M3 series lay inside its 95% prediction interval does not answer it; MSIS is not a coverage measure.", "answers": [{"code": "QWXVP", "text": "The paper does not report that percentage. It only states for one M3 example (series 1664) that all holdout observations fell inside the 95% interval, and gives aggregate error measures (e.g., MSIS) across M1/M3/tourism — not coverage rates.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Correctly says the percentage is not reported, and treats the single-series example and MSIS as not being coverage rates."}}, {"code": "A3TEC", "text": "The paper doesn't report coverage rates (the share of holdout observations inside the 95% intervals). It reports only the MSIS interval scores, not empirical coverage.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Correctly says the paper does not report coverage rates, only MSIS."}}]}, {"text": "Are the differences in accuracy between CES and ETS, ARIMA and the Theta method on the M1, M3 and tourism data statistically significant?", "reference": "Not in all cases. In Nemenyi tests at the 5% level CES has the best mean rank of the univariate models on RMSSE and MASE, but the differences are not all statistically significant. SCUM is significantly better than all the other approaches on every measure.", "marking": "Required: not in all cases: in Nemenyi tests at the 5% level CES has the best mean rank of CES, ETS, ARIMA and the Theta method on RMSSE and MASE, but the differences are not all statistically significant. Not required: that SCUM is significantly better than all the other approaches on every measure. Wrong: saying CES is significantly better than all of ETS, ARIMA and the Theta method (overreach).", "answers": [{"code": "79MD9", "text": "Not always. The Nemenyi test at the 5% level shows CES ranks best among the univariate models on RMSSE and MASE, but the differences are not statistically significant in all cases. SCUM is significantly better than the others, including SCUM(noCES).", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says not always: in Nemenyi tests at the 5% level CES has the best rank on RMSSE and MASE but the differences are not all significant. The SCUM remark is consistent with the reference."}}, {"code": "JF4JT", "text": "Not all of them.\r\n\r\n- **Ranks:** CES had the best mean rank of the four methods on RMSSE and MASE.\r\n- **Significance:** In Nemenyi tests at the 5% level, **not all differences** between CES and ETS, ARIMA and the Theta method on RMSSE and MASE were statistically significant (which qualifies [location]).\r\n\r\nSo CES's advantage in average rank was not uniformly significant against each benchmark.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says not all differences are significant in Nemenyi tests at the 5% level, with CES having the best mean rank on RMSSE and MASE."}}]}, {"text": "What evidence supports the claim that the ETS models with all the distributions considered are well calibrated, and what limitations of this evidence does the paper itself state?", "reference": "In simulation experiment 2 the quantile bias and quantile precision are small and close to zero for every model on every data generating process (bias between −0.013 and 0.011). The authors add that the quantile coverage fluctuates randomly around the nominal levels, a new run giving different shapes. Limits: the authors state none in the text.", "marking": "Required: in simulation experiment 2 the quantile bias and quantile precision are small and close to zero for every model on every data generating process. Not required: the bias range (−0.013 to 0.011); that the quantile coverage fluctuates randomly around the nominal levels, a new run giving different shapes; giving limitations. Acceptable limitations: a single fixed parameter vector with an error standard deviation of 0.1, at which the multiplicative errors are small enough that Normal and logarithmic approximations behave regularly. Limitations: correct if the answer gives limitations from this list or says the authors state none. Wrong: presenting as the authors' a limitation not in this list (also overreach).", "answers": [{"code": "NCFAV", "text": "**Evidence:**\r\n- Quantile bias is near zero across all DGPs: e.g., −0.005 to 0.001 for the Log-Normal DGP across the four distributions; −0.004 to 0.011 for IG.\r\n- Quantile precision is small (0.004–0.011 range), indicating empirical coverage stays close to nominal τ across the 99 quantile levels.\r\n- This holds for Normal, IG, Gamma, and Log-Normal variants of ETS(M,Md,M), as well as the AICc-selected model.\r\n\r\n**Stated limitations:**\r\n- Simulation 2 uses a single fixed parameter vector (σ = 0.1, α = 0.1, β = 0.05, γ = 0.2, φ = 0.95), so multiplicative errors are small and Normal/log approximations behave regularly — calibration may not generalize to larger σ or other parameter regimes.\r\n- The significance test for score differences is not named.\r\n- Results are for ETS(M,Md,M) only; no other component structures tested.", "judge": {"score": 0.5, "invented": 1, "overreach": 1, "reason": "The evidence is correct and the fixed-parameter-vector limitation with σ = 0.1 is acceptable. It also presents as 'stated limitations' an unnamed significance test and the restriction to ETS(M,Md,M), which are not in the acceptable list, so both flags are set."}}, {"code": "FKDDR", "text": "Evidence:\r\n- Quantile bias and precision in [location] are all small and close to zero across DGPs and models.\r\n- Reliability diagrams show quantile coverage fluctuating randomly around nominal levels.\r\n- A repeat run produced different coverage curves, supporting random rather than systematic miscalibration.\r\n\r\nLimitations:\r\n- Calibration is assessed only in the simulation experiment with one DGP model class, ETS(M,Md,M), σ = 0.1, and specific smoothing parameters.\r\n- The paper does not establish calibration universally for all ETS(M,*,*) models or real-world datasets.", "judge": {"score": 0.5, "invented": 1, "overreach": 1, "reason": "The evidence is correct (bias and precision close to zero for all models and DGPs, coverage fluctuating randomly around nominal levels). The limitations go beyond the acceptable list: a single DGP model class and no calibration shown for real-world data are presented as the paper's, which sets both flags."}}]}, {"text": "Does the paper show that Akram's approach gives better quantile forecasts than the ETS models with positive distributions in the tails of the predictive distribution?", "reference": "No. Akram's approach has the lowest mean scaled pinball score overall, but its advantage is in the middle quantiles (between 0.2 and 0.8); below 0.2 and above 0.8 all approaches perform very similarly. The authors conclude that Akram's approach has no obvious practical benefit over the ETS models with positive distributions, which are competitive.", "marking": "Required: No; in the tails (below 0.2 and above 0.8) the approaches perform very similarly, and Akram's advantage is in the middle quantiles (0.2 to 0.8). Also correct: that Akram's approach has the lowest mean scaled pinball score overall, and that the authors see no obvious practical benefit of it, calling the ETS models with positive distributions competitive. Not required: that the tails matter more in practice; that Akram's overall advantage is probably due to estimation difficulties of the pure multiplicative models; that Akram's approach is detached from the ETS framework. Wrong (overreach): saying Akram's approach is better in the tails, or that the positive distributions forecast better than Akram's approach.", "answers": [{"code": "W4KNA", "text": "No. The paper states Akram's log-ETS advantage comes from the central quantiles (τ ∈ [0.2, 0.8]); performance in the tails (τ < 0.2 and τ > 0.8) is similar. The quantile bias/precision table confirms comparable tail behavior, e.g. for the Log-Normal DGP: Akram precision 0.008 vs 0.004–0.009 for the positive-distribution models.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says no: the advantage is in the central quantiles (0.2 to 0.8) and tail performance is similar. The precision figures it adds are not contradicted by the reference or marking guide."}}, {"code": "JED7P", "text": "No. It performs similarly in the tails; its advantage is mainly in the middle quantiles, which the authors say are less practically important.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says no: performance is similar in the tails and Akram's advantage is in the middle quantiles. The remark on practical importance matches a point the marking guide lists as not required."}}]}, {"text": "Does the paper derive the restriction of the smoothing parameters to [0, 1] for every pure multiplicative ETS model?", "reference": "No. It derives α ≤ 1 for ETS(M,N,N) from the requirement that 1 + αϵt stay positive (assuming α is non-negative) and concludes α ∈ [0, 1]. For more complicated pure multiplicative models it states that the smoothing parameters should have similar restrictions for the same reasons, without deriving them.", "marking": "Required: No; the restriction is derived only for ETS(M,N,N) (α ≤ 1 from the requirement that 1 + αϵt stay positive, with α assumed non-negative, giving α ∈ [0, 1]); for the other pure multiplicative models the authors state that similar restrictions should hold, without deriving them. Wrong (overreach): saying the restriction is proved for all pure multiplicative models.", "answers": [{"code": "JNFTH", "text": "No. It derives the restriction explicitly for ETS(M,N,N), then says more complex pure multiplicative models share similar restrictions, but it does not derive them for every model.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says no: the restriction is derived only for ETS(M,N,N), and similar restrictions are stated for more complex models without derivation."}}, {"code": "FJ4HX", "text": "No. The paper derives it only for ETS(M,N,N) (positivity of 1 + αεₜ requires α ≤ 1). For other models, the restriction α, β, γ ∈ [0, 1] is assumed \"by analogy... without a derivation\" (explicitly marked unchecked).", "judge": {"score": 0.5, "invented": 1, "overreach": 0, "reason": "Correct that the derivation is only for ETS(M,N,N) from positivity of 1 + αε_t, but it presents as the paper's a quoted 'by analogy... without a derivation' wording and an 'explicitly marked unchecked' status that the reference does not support."}}]}, {"text": "What data from the M5 competition were used in the empirical analysis, and how were they split for estimation and evaluation?", "reference": "The M5 series were aggregated to monthly frequency and to department-store level to avoid intermittence, giving 70 series of 63 observations. They were grouped by department into seasonal and non-seasonal groups (classified by adam()); one group of a single series was removed, leaving 11 groups. Long histories: the first 51 observations for estimation and the last 12 held out. Short histories: the last 36 observations, 24 for estimation and the same last 12 held out.", "marking": "Required: the M5 series were aggregated to monthly frequency and to department-store level, giving series of 63 observations; long histories use the first 51 observations for estimation and hold out the last 12; short histories use the last 36 observations, 24 for estimation and the same last 12 held out. Not required: the purpose (avoiding intermittence), the 70 series, the grouping by department into seasonal and non-seasonal groups classified by adam(), the removal of a group of one series, the 11 groups. Wrong: a different aggregation, sample length, split or holdout.", "answers": [{"code": "T793M", "text": "**Data:** M5 competition series (Walmart sales) aggregated to monthly frequency and department-store level: 70 series of 63 observations, of which 69 were used — 7 seasonal groups (57 series) and 4 non-seasonal groups (12 series) of the same department, classified by `adam` from the smooth package; one single-series group removed; trended models excluded.\r\n\r\n**Split:**\r\n- **Long histories:** first 51 observations for estimation, last 12 held out.\r\n- **Short histories:** last 36 observations used — 24 for estimation, same 12-month holdout.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "All required elements are correct: monthly department-store aggregation, 63 observations, 51/12 for long histories and last 36 split 24/12 for short. The grouping details are consistent with the reference."}}, {"code": "4XEX9", "text": "The authors used M5 data from Walmart, aggregated to **monthly frequency at department-store level** (70 products, 63 observations each), avoiding the intermittence of the original daily data.\r\n\r\nSplit into two experiments:\r\n- **Long (\"full\"):** 51 observations for estimation, last 12 withheld for accuracy measurement.\r\n- **Short:** last 36 observations only — 24 for fitting, next 12 for evaluation.\r\n\r\nThe same 12-month holdout was used in both cases, keeping results comparable. Series were grouped by department-store (11 seasonal/non-seasonal groups after removing a singleton group), and models were selected per group via `auto.vets`.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Gives the monthly, department-store aggregation with 63 observations, the long split (51 estimation, last 12 held out) and the short split (last 36, 24 estimation, same 12 held out). Extra detail does not contradict the marking guide."}}]}, {"text": "Why do the authors consider the Inverse Gaussian distribution the most convenient of the positive distributions, and what supports that?", "reference": "Its unit-mean restriction is simply μ = 1, its scale has a closed-form maximum likelihood estimate, and the convolution of i.i.d. Inverse Gaussian variables is well defined. The Log-Normal has a non-convex likelihood and a problematic scale estimate, and the Gamma has no closed-form maximum likelihood estimate of the scale. Folks and Chhikara (1978) found that data can be described equally well by the Log-Normal, Gamma and Inverse Gaussian distributions, so the choice can rest on convenience. The support is an argument, not an empirical result: in the simulation the models perform very similarly.", "marking": "Required: at least one convenience property: its unit-mean restriction is simply μ = 1; its scale has a closed-form maximum likelihood estimate; the convolution of i.i.d. Inverse Gaussian variables is well defined; or, by contrast, the Log-Normal has a non-convex likelihood and a problematic scale estimate and the Gamma has no closed-form maximum likelihood estimate of the scale. Also correct: that Folks and Chhikara (1978) found data described equally well by the Log-Normal, Gamma and Inverse Gaussian distributions, so the choice can rest on convenience. Not required: that the support is an argument, not an empirical result.", "answers": [{"code": "UTNN3", "text": "**Why:**\r\n- Its unit-mean restriction is simple: just set location μ = 1.\r\n- Its scale σ² has a closed-form MLE: (1/T)Σ εₜ²/(1+εₜ).\r\n- The convolution of i.i.d. Inverse Gaussian variables is well defined.\r\n- By contrast, Log-Normal has a non-convex likelihood with a scale estimate existing only in some cases, and Gamma has no closed-form scale MLE.\r\n\r\n**Support:** The argument is explicitly one of convenience, not empirical superiority — the authors note that Folks & Chhikara (1978) found data can be described equally well by all three distributions, and their own simulations show the three perform very similarly. [location] concedes \"the argument is not tested.\"", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Gives all the convenience properties, the contrasts with Log-Normal and Gamma, the Folks and Chhikara support, and that the support is an argument rather than an empirical result."}}, {"code": "HXHAM", "text": "They consider it most convenient because it has simple location/scale parameters tied to mean and variance, flexible positive skewness/kurtosis, a tractable closed-form MLE for scale, and a direct relation to the Normal case on high-volume data. They also cite Folks & Chhikara (1978), who found Log-Normal, Gamma and Inverse Gaussian often fit data equally well, so convenience can decide.", "judge": {"score": 0.5, "invented": 1, "overreach": 0, "reason": "Gives the closed-form scale MLE and the Folks and Chhikara point correctly. It also presents as the authors' reasons flexible skewness/kurtosis and a relation to the Normal case, which are not among the reasons in the reference or marking guide."}}]}, {"text": "In simulation experiment 2, does the ETS(M,Md,M) model with the distribution selected by AICc for each series have a lower mean scaled pinball score than all four ETS(M,Md,M) models with a fixed distribution, on every data generating process?", "reference": "No. It is lowest on the Inverse Gaussian (5.175), Log-Normal (9.332) and Akram (5.178) data, but the Normal model is lower on the Normal data (5.255 against 5.258) and on the Gamma data (5.193 against 5.208). The authors describe the AICc selection as performing well in the majority of cases.", "marking": "Required: No; it is lowest on the Inverse Gaussian (5.175), Log-Normal (9.332) and Akram (5.178) data, but the Normal model is lower on the Normal data (5.255 against 5.258) and on the Gamma data (5.193 against 5.208). Not required: that the authors describe the AICc selection as performing well in the majority of cases. Wrong (overreach): saying the AICc selection is always best.", "answers": [{"code": "RVVUF", "text": "No. The Auto/AICc-selected model is not consistently lower than all fixed-distribution models on every DGP. For example, on the Inverse Gaussian DGP, the fixed Gamma model has a lower score than Auto.", "judge": {"score": 0.5, "invented": 1, "overreach": 0, "reason": "The 'No' is right, but the supporting example is wrong: on the Inverse Gaussian data the AICc-selected model is the lowest, and the real exceptions (Normal and Gamma data) are not given. Invented is set for the false claim about the fixed Gamma model."}}, {"code": "QK973", "text": "No. The Auto (AICc) row beats all four fixed-distribution models on the Inverse Gaussian, Gamma, Log-Normal, and Akram DGPs, but **not** on the Normal DGP, where the fixed Normal model has the lowest SPS (5.255 vs Auto's 5.258).", "judge": {"score": 0.5, "invented": 1, "overreach": 0, "reason": "The 'No' and the Normal-data exception (5.255 against 5.258) are right, but it wrongly says the AICc-selected model is best on the Gamma data, where the Normal model is lower (5.193 against 5.208). Invented is set for that false claim."}}]}, {"text": "On the M5 data, was VETS D more or less accurate in rMAE than univariate ETS forecasts made coherent by a hierarchical reconciliation method?", "reference": null, "marking": "Required: says the authors do not report this (any wording). Wrong: giving an answer as the authors'. A mention of earlier work that compared a multivariate model with reconciliation approaches on other data does not answer it.", "answers": [{"code": "Q43DV", "text": "The paper does not compare VETS D against hierarchically reconciled ETS forecasts. It benchmarks VETS D only against univariate ETS models (ETS, ETS (ADAM), ETS LN) and Naïve — no reconciliation methods (e.g. MinT) are applied or evaluated.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says the paper does not compare VETS D with hierarchically reconciled ETS forecasts."}}, {"code": "UQQQF", "text": "The paper does not contain any comparison of VETS D with hierarchically reconciled ETS forecasts. The only benchmarks on the M5 data are the three univariate ETS models (ETS LN, ETS (ADAM), ETS) and the Naïve method, so this comparison cannot be answered from the document.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says the paper contains no such comparison and that the question cannot be answered from it."}}]}, {"text": "Which value of the tuning parameter γ gave the shortest detection delays in the simulations?", "reference": null, "marking": "Required: says the authors do not report this (any wording). Wrong: giving an answer as the authors'. Also correct: saying that only γ = 0 was used.", "answers": [{"code": "EQWUV", "text": "The paper doesn't say. All simulations use γ = 0, and no other values are compared, so no comparison of detection delays across γ values is reported.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says the paper does not report this and that only γ = 0 was used."}}, {"code": "N7XXJ", "text": "The paper only reports results for γ = 0; no other values were tested, so it doesn't say which gives the shortest delays.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says the paper reports only γ = 0 and does not say which value gives the shortest delays."}}]}, {"text": "On the mean surface temperature data, which model and data were used, and how did the conventional MSE estimator compare with the other estimators?", "reference": "An ARIMA(1,1,2) model on the monthly HadCRUT4 series for a location in Greenland (322.5°, 62.5°), January 1849 to December 2017, 2,016 observations, with the last 60 held out. The conventional MSE did worst of the six estimators on every measure (RMSE 1.217, MAE 0.849, ME −0.450); GPL was very close to it (1.214, 0.846, −0.444), and the multi-step estimators did better.", "marking": "Required: says the conventional MSE did worst, or did not perform well, on all three error measures (RMSE, MAE, ME). Not required: the other details of the reference answer.", "answers": [{"code": "47R7Q", "text": "**Model/data:** ARIMA(1,1,2) fitted to monthly HadCRUT4 mean surface temperature data (HadCRUT.4.5.0.0) for a location in Greenland (322.5°E, 62.5°N), January 1849–December 2017 (2016 observations), with the last 5 years (60 points) withheld for testing.\r\n\r\n**MSE performance:** The conventional MSE performed worst of all six estimators — RMSE 1.217, MAE 0.849, ME −0.450 (highest errors, most biased). All multi-step estimators beat it; MSE_h was best (RMSE 1.128, MAE 0.784, ME 0.009). GPL was nearly identical to MSE.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Correct model and data, and says the conventional MSE did worst of the six estimators on RMSE, MAE and ME, with GPL close to it."}}, {"code": "7CMPK", "text": "**Model and data:** An ARIMA(1,1,2) was fitted to the HadCRUT.4.5.0.0 monthly Mean Surface Temperature series for Greenland (grid cell 322.5°E, 62.5°N), trained on 1,956 observations (Jan 1849–Dec 2012) and evaluated on a 60-month holdout (Jan 2013–Dec 2017), using the R package smooth v3.2.1.\r\n\r\n**MSE₁ vs. the others:** MSE₁ was outperformed by all multi-step estimators on accuracy — RMSE 1.217 and MAE 0.849, worse than MSE_h (1.128/0.784), TMSE (1.198/0.827), GTMSE (1.190/0.819), MSCE (1.185/0.817) and GPL (1.214/0.846). Its ME (−0.45) was also more biased than MSE_h's (0.009), though comparable to TMSE (−0.402) and GPL (−0.444). Its parameter estimates were plausible, however: AR(1) = 0.558 (positive, as the climate literature expects), unlike MSE_h's distorted −0.786.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Correct model and data, and shows the conventional MSE with the highest RMSE and MAE and the largest bias in ME, so it performed poorly on all three measures."}}]}, {"text": "In the MCB test on rMAE that the paper reports for the M5 data (its Figure 2), are the differences between the VETS and ETS models on the same history length (long with long, short with short) statistically significant?", "reference": "No. VETS F on long histories has the lowest mean rank, but it is not significantly different from VETS D, ETS LN, ETS (ADAM) and ETS on long histories or from VETS D on short ones; on short histories the ETS models do worse in mean rank, but those differences are not significant either.", "marking": "Required: no; within the same history length no difference between the VETS and ETS models is statistically significant. Also correct: comparisons across history lengths (long-history VETS F against the short-history ETS models and short-history VETS F) are significant. Not required: that VETS F on long histories has the lowest mean rank; that the ETS models have worse mean ranks on short histories. Wrong (overreach): saying VETS is significantly more accurate than ETS on the same history length.", "answers": [{"code": "MVUXA", "text": "No. The MCB test found no statistically significant differences between VETS and ETS models on the same history length:\r\n\r\n- **Long history:** VETS F had the lowest mean rank, but was **not statistically different** from VETS D, ETS LN, ETS (ADAM), or ETS.\r\n- **Short history:** VETS D ranked best, but was **not statistically different** from ETS LN, ETS (ADAM), or ETS (VETS F on short data ranked lower and was also not significantly different from the ETS models).\r\n\r\nSo while VETS models tended to have better (lower) ranks, the differences were not statistically significant at the level used.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says no significant differences between VETS and ETS on the same history length, with detail consistent with the reference."}}, {"code": "JMHDQ", "text": "No. [location] states that in the MCB test on rMAE, the differences between the five models on the M5 data are not shown to be statistically significant. [location] likewise notes the differences are not statistically significant.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Answers no, the differences between the models are not statistically significant, which covers the same-history comparisons asked about, though with little detail."}}]}, {"text": "What in the paper's simulations supports the claim that monitoring forecast errors greatly reduces the detection delay while keeping a low false positive rate, and what limitations of this evidence does the paper itself state?", "reference": "In the simulations, ARMA Forecast Errors has a high detection probability and a lower average detection delay than the Raw CUSUM for mean and trend changes in seasonal data, forecast errors do better than the Raw CUSUM in all autoregressive parameter scenarios, and the false detection probability is low (below 0.075 in the autoregressive scenarios). Limitations the authors state: Assumptions 1 and 2, which the theoretical validity of the stopping rule requires, are not necessarily satisfied in all scenarios; and the forecasting model chosen by auto.arima may be misspecified.", "marking": "Required: at least one simulation result that supports the claim: ARMA Forecast Errors has a high detection probability and a lower average detection delay than the Raw CUSUM for mean and trend changes in seasonal data; forecast errors do better than the Raw CUSUM in all autoregressive parameter scenarios; the false detection probability is low (below 0.075 in the autoregressive scenarios). Not required: limitations. Limitations the authors state: (1) Assumptions 1 and 2, which the theoretical validity of the thresholds requires, are not necessarily satisfied in all the simulated scenarios; (2) the forecasting model chosen by auto.arima may be misspecified; (3) all simulated data have an ARMA error structure with normally distributed innovations and a training sample of 300 (200 in the simpler supplementary simulations). Limitations: correct if the answer gives limitations from this list or says the authors state none. Wrong: presenting as the authors' a limitation not in this list (also overreach).", "answers": [{"code": "UYFUE", "text": "**Supporting evidence (simulations [location]):**\r\n- Seasonal mean changes: ARMA forecast errors had higher detection probability and lower ADD than Raw CUSUM at all sizes.\r\n- Seasonal trend changes: both near-perfect DP, but forecast errors had lower ADD.\r\n- AR-parameter changes: ARMA and ETS errors beat Raw CUSUM on DP and ADD in all scenarios.\r\n- Non-seasonal mean changes: much lower ADD with DP at least as high.\r\n- Non-seasonal variance changes: nearly always lower ADD.\r\n- Low false positives: FDP below 0.075 for AR changes, below 0.05 for variance changes; \"low\" for mean/trend.\r\n\r\n**Stated limitations:**\r\n- [location]: the two forecasting-model assumptions (constant bias, incomplete adjustment) are not necessarily satisfied in all simulated scenarios, so theoretical thresholds may not be valid everywhere.\r\n- [location]: all data are ARMA with normal innovations and a training sample of 300 (200 in the supplementary simulations), limiting transferability.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Gives the supporting simulation results (lower delay than Raw CUSUM for seasonal mean and trend changes, better in all AR scenarios, false detection below 0.075). Its two limitations are both in the list."}}, {"code": "KMMF3", "text": "Supporting evidence: In all simulated scenarios (mean and trend changes in seasonal data; AR parameter changes), the ARMA/ETS forecast-error detectors had higher detection probabilities and shorter average detection delays than the Raw CUSUM, with FDP near the nominal 0.05 (all < 0.075).\r\n\r\nLimitations stated by the paper: (1) [location] are not satisfied in all scenarios, so the theoretical validity of thresholds doesn't always hold; (2) results are specific to the tested settings — seasonal frequencies, change types/sizes, and the particular models used; no universal claim is made.", "judge": {"score": 0.5, "invented": 1, "overreach": 1, "reason": "Gives supporting results and the listed limitation on the assumptions. But it extends higher detection probability and false detection below 0.075 to all scenarios and detectors, and presents as the authors' a limitation not in the list (results specific to seasonal frequencies, change sizes and models)."}}]}, {"text": "Do the paper's simulation and empirical results cover vector ETS models with a trend component?", "reference": "No. The simulation uses only VETS(M,N,M;LN), and on the M5 data models with trend were excluded because the trends in the two trended series were weak. The authors name the trend element as something that may change how the methods behave, for future work.", "marking": "Required: no; the results do not cover models with a trend. Not required: the reasons (the simulation uses only VETS(M,N,M;LN); on the M5 data trend models were excluded because the trends of the two trended series were weak); that the authors name the trend element for future work. Wrong (overreach): extending the findings to trended models.", "answers": [{"code": "P3JEV", "text": "No. [location] states that models with a trend component are not analysed, neither in the simulation nor on the M5 data. The simulation uses only VETS(M,N,M;LN) (no trend), and the M5 analysis explicitly excluded trended models.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says no, with the correct reasons: the simulation uses only VETS(M,N,M;LN) and the M5 analysis excluded trended models."}}, {"code": "AWRC4", "text": "**No — neither covers trend models in the experiments.**\r\n\r\n- **Simulation:** focuses exclusively on **VETS(M,N,M;LN)** — the \"N\" denotes no trend. The paper states this explicitly: the simulation \"focuses on the VETS(M,N,M;LN) model and compares performances of its various PIC variations.\"\r\n\r\n- **Empirical (M5):** after classifying the 70 series with `adam`, the authors found the majority were seasonal but **non-trended** (\"The trends in the two time series are not very strong, and so models with trend components have been excluded from consideration\"). They applied only **VETS(M,N,M;LN)** to seasonal groups and **VETS(M,N,N;LN)** to non-seasonal groups.\r\n\r\nThe trend component is discussed only in the theoretical framework (e.g., the VETS(M,Md,M;LN)PIC(LTSD,LTS,S) example in [location]), not in the reported experiments.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says no, citing the simulation's sole use of VETS(M,N,M;LN) and the exclusion of trend models on M5 because the two trends were weak. Extra detail does not contradict the reference."}}]}, {"text": "Which PIC restrictions did the automatic selection choose for the 11 VETS D models on the M5 data, and how often was each chosen?", "reference": "PIC(LS,S,N) in 6 groups, PIC(L,L,N) in 2, and PIC(N,N,N), PIC(L,N,N) and PIC(LS,S,S) in 1 each. Only one (seasonal) group had common seasonal components.", "marking": "Required: PIC(LS,S,N) is the most frequent, chosen in 6 of the 11 groups. Not required: the other restrictions and counts (PIC(L,L,N) in 2; PIC(N,N,N), PIC(L,N,N) and PIC(LS,S,S) in 1 each), or that only one group had common seasonal components. Wrong: another restriction as the most frequent, or another count for PIC(LS,S,N).", "answers": [{"code": "EUXNP", "text": "From [location], for the 11 VETS D groups:\r\n\r\n-
