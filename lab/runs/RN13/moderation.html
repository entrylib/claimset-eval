const DATA = {"sheet": "20261128", "items": [{"text": "What supports the claim that GTMSE is the least biased and most efficient of the multi-step estimators, and what limitations of the claim does the paper itself state?", "reference": "Analytically, the logarithms in GTMSE balance the one-step variance against the sum of ĉ_j terms, so its shrinkage is milder than that of MSE_h, TMSE or MSCE. In the simulations GTMSE gives the least biased and most efficient estimates among the multi-step estimators in the cases the authors report, and converges faster than the other multi-step estimators. Limitations the authors state: MSE_1 still gives more efficient and less biased estimates in the simulations, and outperforms GTMSE; GTMSE rests on setting the covariances between forecast errors to zero, which the authors say cannot hold in real life; and for the wrong ARIMA(1,1,1) model all the multi-step estimators, GTMSE included, make the AR estimate worse on small samples.", "marking": "Required: the support: the logarithms make GTMSE's shrinkage milder than that of MSE_h, TMSE and MSCE, and in the simulations GTMSE gives the least biased and most efficient estimates among the multi-step estimators. Not required: that GTMSE converges faster than the other multi-step estimators. Acceptable limitations: (1) MSE_1 still gives more efficient and less biased estimates in the simulations, and outperforms GTMSE; (2) GTMSE rests on setting the covariances between forecast errors of different horizons to zero, which cannot hold in real dynamic series unless every c_j is zero; (3) for a wrong ARIMA(1,1,1) model all the multi-step estimators, GTMSE included, make the AR estimate worse on small samples; (4) the simulations cover only two data generating processes (ETS(A,N,N) with α = 0.2 and ARIMA(0,1,1) with θ = 0.6) and pure additive linear models; (5) the simulation results are shown visually as boxplots, not as tabulated summary statistics. Limitations: correct if the answer gives limitations from this list or says the authors state none. Wrong: presenting as the authors' a limitation not in this list (also overreach).", "answers": [{"code": "TYA33", "text": "**Support:**\r\n- **Analytical:** GTMSE's log form balances the one-step-ahead variance against the $\\hat{c}_j^2$ terms, so its shrinkage is milder than MSE_h/TMSE/MSCE.\r\n- **Simulation:** Boxplots show GTMSE's parameter estimates converge to true values faster, with less bias and dispersion than other multi-step estimators across both DGPs, all models, horizons, and sample sizes.\r\n\r\n**Limitations stated in the paper:**\r\n- GTMSE is still generally less efficient and more biased than MSE₁ when the model is correct — the improvement is only relative to other multi-step estimators.\r\n- With a wrong model (e.g., ARIMA(1,1,1) on ETS data), GTMSE still distorts parameters and \"does not help\" — it makes the situation worse on small samples, like the other multi-step estimators.\r\n- On the temperature data, GTMSE forecasts were no better than TMSE/MSCE and worse than MSE_h.", "judge": {"score": 0.5, "invented": 1, "overreach": 1, "reason": "Analytical and simulation support are correct, and the MSE_1 and wrong-ARIMA(1,1,1) limitations are acceptable. The temperature-data limitation is not in the acceptable list, and the simulation result is stated as holding across all models, horizons and sample sizes."}}, {"code": "JHP4H", "text": "**Support:** Monte Carlo simulations — 500 series each from ETS(A,N,N) (α=0.2) and ARIMA(0,1,1) (θ=0.6), across T ∈ {20…5000} and h ∈ {10…200}, comparing MSE₁, MSE_h, TMSE, GTMSE, MSCE. Boxplots show lower median bias and narrower interquartile range for GTMSE than for MSE_h, TMSE and MSCE.\r\n\r\n**Stated limitations:**\r\n- Only two univariate DGPs and pure additive linear models; results shown visually via boxplots, not tabulated statistics.\r\n- **[location] scope:** Only holds where T > h; benefit is relative to other multi-step estimators, not to MSE₁ (which [location] shows is less biased when true parameters are non-zero).\r\n- **[location] qualifies it:** under misspecification with an over-parameterised ARIMA(1,1,1), multi-step estimators distort parameters — shrinkage isn't universally beneficial.", "judge": {"score": 0.5, "invented": 1, "overreach": 1, "reason": "Gives the simulation support but omits the analytical argument that the logarithms make GTMSE's shrinkage milder. Several limitations are acceptable, but 'only holds where T > h' is presented as the authors' and is not in the acceptable list."}}]}, {"text": "What does the model name VETS(M,Md,M;LN)PIC(LTSD,LTS,S) mean?", "reference": "A pure multiplicative vector ETS model with a multiplicative damped trend and multiplicative seasonality, applied to log-transformed data (LN). PIC(LTSD,LTS,S): the smoothing parameters of level, trend and seasonality and the damping parameter are common to all series (P = LTSD); the initial level, trend and seasonal indices are common (I = LTS); and only the seasonal component is common, while level and trend are individual (C = S).", "marking": "Required: a correct reading of each of P, I and C: P = LTSD, the smoothing parameters of level, trend and seasonality and the damping parameter are common to all series; I = LTS, the initial level, trend and seasonal indices are common; C = S, only the seasonal component is common, while level and trend are individual. Also correct: 'damped trend' for Md, with or without 'multiplicative'. If the answer gives block matrices, both forms are correct: for an individual seasonal component W_3 = Φ or W_3 = I_n; for common smoothing parameters A = α1'_n or A = αI_n, B = β1'_n or B = βI_n, Γ = γ1'_n or Γ = γI_n. Not required: that the model is pure multiplicative on log-transformed data. Wrong: misreading any of P, I or C.", "answers": [{"code": "PPW9E", "text": "**VETS(M,Md,M;LN)** — the base model:\r\n- **M** (first): multiplicative error\r\n- **Md**: damped multiplicative trend\r\n- **M** (third): multiplicative seasonality\r\n- **;LN**: estimated on log-transformed data (pure multiplicative, log-normal errors, geometric-mean forecasts)\r\n\r\n**PIC(LTSD,LTS,S)** — the commonality restrictions across the n series:\r\n- **P = LTSD**: common smoothing parameters for Level, Trend, Seasonality, and Damping (one shared α, β, γ, φ)\r\n- **I = LTS**: common Initial values for level, trend, and seasonal indices\r\n- **C = S**: common seasonal Component (a single shared seasonal index $s_t$ across all series); levels and trends remain individual\r\n\r\nSo all series share one seasonal pattern, one set of smoothing/damping parameters, and common starting values — while each keeps its own level and trend trajectory. This is the example worked through in [location] (with n=2).", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Reads P = LTSD, I = LTS and C = S correctly, with level and trend individual, and describes the base model correctly."}}, {"code": "NK3MF", "text": "Breaking it down:\r\n\r\n**VETS(M,Md,M;LN)** — the base model:\r\n- **M** (first): multiplicative error\r\n- **Md**: multiplicative trend, **damped**\r\n- **M** (third): multiplicative seasonality\r\n- **;LN**: the equations hold for the logarithms of the data, states and errors (log-normal errors)\r\n\r\n**PIC(LTSD,LTS,S)** — the sharing restrictions:\r\n- **P = LTSD**: common smoothing parameters for **L**evel, **T**rend, **S**easonal component, and the **D**amping parameter\r\n- **I = LTS**: common **i**nitial values for level, trend and seasonal component\r\n- **C = S**: common **c**omponent (one state shared by all series) for the seasonal component only; level and trend remain individual to each series", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Reads P, I and C correctly: common smoothing and damping parameters, common initial values, and only the seasonal component common with level and trend individual."}}]}, {"text": "Are multi-step estimators always less efficient than the conventional one-step estimator MSE_1?", "reference": "No. The authors argue they are in general less efficient, but that MSE_h can be more efficient where the true parameters make c_j close to zero. In the simulations, multi-step estimators were more efficient than MSE_1 on small samples for a parameter whose true value is zero (β of ETS(A,A,N) fitted to ETS(A,N,N) data).", "marking": "Required: No: they are less efficient in general, but MSE_h can be more efficient where the true parameters make c_j close to zero. Also correct: noting that the efficiency argument is disputed (argued, not proved; not an asymptotic effect). Not required: the simulation result for a parameter whose true value is zero (β of ETS(A,A,N) fitted to ETS(A,N,N) data). Wrong: saying they are always less efficient (overreach).", "answers": [{"code": "P3QDF", "text": "No. In the simulations with non-zero true parameters, MSE₁ was the least biased and most efficient, and under correct specification no consistent multi-step estimator has lower asymptotic variance than the one-step Gaussian estimator.\r\n\r\nBut there are exceptions:\r\n- when a redundant parameter is zero (e.g., trend β = 0), multi-step estimators estimate it more efficiently than MSE₁ on small samples.\r\n- MSE_h can have lower asymptotic parameter variance than MSE₁ where \\(c_j\\) is near zero — though this is disputed (argued from likelihood curvature, not proved; a Monte Carlo found MSCE more efficient than MSE_h).", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says no: MSE_1 is generally more efficient, with exceptions where c_j is near zero and for a zero-valued parameter on small samples. Noting that the efficiency argument is disputed is accepted by the guide."}}, {"code": "YVREP", "text": "No. The paper shows analytically that there are regions of the parameter space where MSE_h is *more* efficient than MSE_1 — specifically when the true parameters are such that the c_j values are close to zero. This holds despite MSE_h being less efficient in general.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says no: MSE_h is less efficient in general but can be more efficient where the true parameters make c_j close to zero. 'Shows analytically' is a little stronger than the authors' argued claim, but not enough to flag."}}]}, {"text": "How is the stability region of CES derived, and is it derived for seasonal CES?", "reference": "For non-seasonal CES it is derived from the invertibility conditions of the underlying ARMA(2,2), which correspond to stability of the state-space model, giving three inequalities: (α0 − 2.5)² + α1² > 1.25, (α0 − 0.5)² + (α1 − 1)² > 0.25 and (α0 − 1.5)² + (α1 − 0.5)² < 1.5. For seasonal CES it is not derived: stability can be checked by requiring all eigenvalues of the seasonal discount matrix to lie inside the unit circle; the parameter restrictions are not derived because they cannot be easily analysed.", "marking": "Required: for non-seasonal CES, the stability region is derived from the invertibility conditions of the underlying ARMA(2,2), which correspond to stability of the state-space model, or from the eigenvalues of the discount matrix (both correct); for seasonal CES it is not derived: the restrictions cannot be easily analysed, and stability is checked by requiring all eigenvalues of the discount matrix to lie inside the unit circle. Not required: the three inequalities ((α0 − 2.5)² + α1² > 1.25, (α0 − 0.5)² + (α1 − 1)² > 0.25, (α0 − 1.5)² + (α1 − 0.5)² < 1.5).", "answers": [{"code": "XPTX9", "text": "**Non-seasonal CES:** Derived from the invertibility conditions of its underlying ARMA(2,2) model. The stable region is bounded by three circles: $(\\alpha_0-2.5)^2+\\alpha_1^2>1.25$, $(\\alpha_0-0.5)^2+(\\alpha_1-1)^2>0.25$, and $(\\alpha_0-1.5)^2+(\\alpha_1-0.5)^2<1.5$.\r\n\r\n**Seasonal CES:** No — the parameter restrictions under which seasonal CES is stable are **not derived**. Its stationarity/non-stationarity is only argued by analogy to non-seasonal CES.", "judge": {"score": 0.5, "invented": 0, "overreach": 0, "reason": "Correct that non-seasonal CES stability comes from the invertibility conditions of the underlying ARMA(2,2), and that it is not derived for seasonal CES. It omits that seasonal stability is checked through the eigenvalues of the discount matrix and that the restrictions cannot be easily analysed."}}, {"code": "KXKXK", "text": "It is derived from the discount matrix $D = F - gw'$ in the SSOE state-space form. CES is stable when all eigenvalues of $D$ lie inside the unit circle; substituting the CES matrices gives eigenvalues\r\n\r\n$$\\lambda = \\frac{2 - 2\\alpha_0 + \\alpha_1 \\pm \\sqrt{8\\alpha_1 + 4\\alpha_0 - 4\\alpha_0\\alpha_1 - 4 - 3\\alpha_1^2}}{2},$$\r\n\r\nwhich lead to the inequalities in (15) (circles in the $\\alpha_0$–$\\alpha_1$ plane).\r\n\r\nFor seasonal CES, the paper only says stability can be checked from the eigenvalues of the 4×4 discount matrix in (21), but it does not derive an explicit region and says the restrictions “cannot be easily analyzed.”", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Derives the non-seasonal region from the eigenvalues of the discount matrix, which the guide accepts. Correctly says the seasonal region is not derived, is checked through the discount matrix eigenvalues, and cannot be easily analysed."}}]}, {"text": "How do multi-step loss functions shrink the smoothing parameters of ETS(A,N,A)?", "reference": "Stepwise, as complete seasonal cycles accumulate: γ̂ does not shrink while h ≤ m; α̂ shrinks faster than γ̂ on shorter horizons, and γ̂ shrinks faster once h > 2m. As h → ∞ the model becomes deterministic.", "marking": "Required: the stepwise shrinkage: γ̂ does not shrink while h ≤ m, α̂ shrinks faster than γ̂ on shorter horizons, γ̂ shrinks faster once h > 2m, and the model becomes deterministic as h → ∞. Also correct: adding, alongside the authors' statement, that the switch at h > 2m rests on incorrect coefficients and that with the correct ones the pressure on α̂ always exceeds that on γ̂. Also correct: either form of the coefficients, c_j = α + γ j_m with j_m = ⌊(j−1)/m⌋, or c_j = α + γ when j is a multiple of m and α otherwise. Not required: the coefficients.", "answers": [{"code": "DFX94", "text": "Per [location]: the seasonal smoothing parameter \\(\\hat{\\gamma}\\) shrinks **stepwise** — only when \\(h > m\\), in steps of whole seasonal cycles — and once \\(h > 2m\\), it shrinks faster than the level parameter \\(\\hat{\\alpha}\\).\r\n\r\nMechanism: the multi-step coefficient \\(c_j = \\alpha + \\gamma\\) when \\(j\\) is a multiple of \\(m\\), and \\(\\alpha\\) otherwise (corrected from the paper's misprint). Multi-step losses minimise \\(\\hat{c}_j^2\\), so \\(\\gamma\\) is pressured only at horizons that reach seasonal lags, while \\(\\alpha\\) is pressured at every horizon.\r\n\r\nCaveat: the \\(h > 2m\\) switch rests on the misprinted coefficients; with the corrected \\(c_j\\), the pressure on \\(\\hat{\\alpha}\\) always exceeds that on \\(\\hat{\\gamma}\\).", "judge": {"score": 0.5, "invented": 0, "overreach": 0, "reason": "Gives the stepwise shrinkage, the h > m and h > 2m points, and the accepted caveat on the coefficients, but omits that the model becomes deterministic as h → ∞."}}, {"code": "R9PHF", "text": "For ETS(A,N,A), the shrinkage happens in a stepwise manner, tied to complete seasonal cycles:\r\n\r\n- **α (level):** shrinks towards zero immediately, faster than γ on short horizons (h ≤ m).\r\n- **γ (seasonal):** does not shrink at all while h ≤ m; it starts shrinking only once the horizon exceeds the seasonal periodicity, because its weight enters via j_m = ⌊(j−1)/m⌋.\r\n- **Switch:** for h > 2m, γ starts shrinking faster than α, since its weight dominates the sum.\r\n\r\nAs h → ∞, the model becomes deterministic. Also, since all smoothing parameters are positive, the forecast-error covariances are positive, making MSCE's shrinkage the strongest of all multi-step loss functions for this model.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Covers all required points: stepwise shrinkage, no shrinkage of gamma while h ≤ m, alpha faster on short horizons, gamma faster once h > 2m, and a deterministic model as h → ∞."}}]}, {"text": "How did the direct multi-step estimator, with a separate model for each horizon, perform on the mean surface temperature data?", "reference": null, "marking": "Required: says the authors do not report this (any wording). Wrong: giving an answer as the authors'.", "answers": [{"code": "7FH7T", "text": "The paper did not use the direct multi-step estimator (DMS) with a separate model per horizon on this data. For MSE_h, only the single model estimated for the specific horizon h = 60 was used, not 60 separate models.\r\n\r\nThat single MSE_h model performed best in accuracy (RMSE 1.128, MAE 0.784, ME 0.009), but fit the data poorly — it didn't react to local changes, as it was optimized only for the 60-step-ahead horizon. Its parameters were also heavily shrunk (AR(1) = −0.786), which climatologists would consider unrealistic.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says explicitly that the paper did not use the direct estimator with a separate model per horizon on this data. The results it gives are clearly labelled as those of the single MSE_h model."}}, {"code": "AENVU", "text": "The paper doesn't use a separate model per horizon. Its \"direct\" multi-step estimator, MSE_h, fits a single ARIMA(1,1,2) by minimising squared errors at one horizon — h = 60 on the Greenland temperature data.\r\n\r\nIt achieved the best accuracy (RMSE 1.128, MAE 0.784, |ME| 0.009) but at the cost of a distorted, negative AR(1) estimate (−0.786), unlike the positive estimates from GTMSE, MSCE and GPL.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says the paper does not use a separate model per horizon, so what is asked is not reported. The results it gives are explicitly for a different, single-model estimator."}}]}, {"text": "Are the assumptions under which the detectors' thresholds are valid satisfied in all the simulated scenarios?", "reference": "No. The authors state that Assumptions 1 and 2, which the theoretical validity of the stopping rule requires, are not necessarily satisfied in all the simulated scenarios, and that the performance is still satisfactory.", "marking": "Required: no. Also correct: the authors state that Assumptions 1 and 2, which the theoretical validity of the stopping rule requires, are not necessarily satisfied in all the simulated scenarios, and that performance is still satisfactory; adding that the validity of the detectors' limit distributions is disputed. Not required: the disputed limit distributions. Wrong: saying the assumptions hold, or that the thresholds are theoretically valid, in every simulation.", "answers": [{"code": "EPXCP", "text": "No. The paper explicitly states that [location] \"are not necessarily satisfied in all scenarios,\" but shows satisfactory performance anyway.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says no, the assumptions are not necessarily satisfied in all scenarios, and performance is still satisfactory, matching the reference."}}, {"code": "NRFNK", "text": "No. [location] states that the two forecasting-model assumptions (constant bias [location] and incomplete adjustment [location]) \"are not necessarily satisfied in all the simulated scenarios,\" so the theoretical thresholds are not guaranteed to be valid everywhere in the simulations.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says no, the two assumptions are not necessarily satisfied in all simulated scenarios, so the thresholds are not guaranteed valid everywhere; consistent with the guide."}}]}, {"text": "On the mean surface temperature data, did TMSE, GTMSE and MSCE give more accurate forecasts than MSE_h?", "reference": "No. On that series MSE_h (h = 60) was the most accurate in RMSE (1.128) and MAE (0.784) and the least biased in ME (0.009); TMSE, GTMSE and MSCE (RMSE 1.198, 1.190, 1.185) were more accurate than the conventional MSE and GPL, but not than MSE_h. They did beat MSE_h on the Air Passengers data.", "marking": "Required: No: on that series MSE_h was the most accurate. Also correct: giving this and adding that the authors' general concluding statement says TMSE, GTMSE and MSCE are more accurate than both MSE_1 and MSE_h. Not required: the comparison with the conventional MSE and GPL; the Air Passengers comparison. Wrong: saying they beat MSE_h on the temperature data on the strength of that general statement alone (overreach).", "answers": [{"code": "CDFNA", "text": "No. On the mean surface temperature data, MSE_h was the most accurate: RMSE 1.128, MAE 0.784, ME 0.009 — all better than TMSE (1.198, 0.827, −0.402), GTMSE (1.190, 0.819, −0.366), and MSCE (1.185, 0.817, −0.343).", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Correctly answers no: MSE_h was the most accurate on the temperature data, with RMSE, MAE and ME values matching the reference."}}, {"code": "MXANY", "text": "No. On the HadCRUT4 Greenland temperature series, MSE_h (h=60) had the lowest RMSE (1.128), MAE (0.784) and |ME| (0.009) — better than TMSE (1.198/0.827/0.402), GTMSE (1.190/0.819/0.366) and MSCE (1.185/0.817/0.343).\r\n\r\nBut the paper notes: MSE_h achieved this by over-shrinking — its AR(1) estimate was −0.786, an unrealistic negative value, whereas GTMSE/MSCE/GPL gave positive estimates consistent with the climate literature.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Correctly answers no: MSE_h was the most accurate on the temperature series, with values matching the reference. The added remark on over-shrinkage does not contradict the marking guide."}}]}, {"text": "Which single series does the paper discuss as a failure of CES in the M1, M3 and tourism experiment, and how did CES and ETS score on it?", "reference": "One M1 series (number 47) on which CES failed to identify the trend: its MSIS was 523.034 against 25.590 for ETS. It is the main reason why the mean MSIS of CES is much higher than its median. All models underforecast an unpredictable increase in the holdout, but ETS selected ETS(M,N,N) with a high smoothing parameter (0.881), whose prediction interval exploded and happened to cover it better than the more conservative CES interval.", "marking": "Required: one M1 series on which CES failed to identify the trend; MSIS 523.034 for CES against 25.590 for ETS. Not required: the series number (47); that this series is the main reason why the mean MSIS of CES is much higher than its median; why ETS did better (all models underforecast an unpredictable increase in the holdout; ETS selected ETS(M,N,N) with smoothing parameter 0.881, whose prediction interval exploded and happened to cover it).", "answers": [{"code": "UEHF3", "text": "Series 47 from the M1 dataset. CES missed the unpredictable holdout surge and had MSIS 523.034, while ETS(M,N,N) scored 25.590.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Identifies M1 series 47 and gives both MSIS values correctly. It describes the failure as missing the holdout surge rather than failing to identify the trend, which is consistent with the reference."}}, {"code": "FFFPD", "text": "M1 series 47.\r\n\r\n- **CES:** MSIS = 523.034 — it failed to identify the trend.\r\n- **ETS:** selected ETS(M,N,N), MSIS = 25.590.\r\n\r\nThis single failure inflated CES's mean MSIS on the M1/M3/tourism data.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Identifies the M1 series on which CES failed to identify the trend, with MSIS 523.034 for CES against 25.590 for ETS."}}]}, {"text": "Which model and error distribution did automatic selection choose for the electric vehicle charging data, with what AICc, and how did it compare with an additive model?", "reference": "ETS(M,Md,M) with the Gamma distribution, selected by AICc among pure multiplicative models and distributions with auto.adam(), with AICc 6,398.570. An ETS(A,Ad,A) model with the Normal distribution had AICc 6,418.296, so the pure multiplicative model was preferred.", "marking": "Required: ETS(M,Md,M) with the Gamma distribution, its AICc of 6,398.570, and that the additive ETS(A,Ad,A) model with the Normal distribution had a higher AICc (6,418.296), so the pure multiplicative model was preferred. Not required: the estimated parameters (α = 0.1683, β = 0, γ = 0.0013, φ = 0.9925, σ = 0.276); how the selection was done. Wrong: a different model, distribution or AICc value.", "answers": [{"code": "XAFYC", "text": "Automatic AICc selection (`smooth::auto.adam`) chose **ETS(M,Md,M) with Gamma errors**, with **AICc = 6398.57**.\r\n\r\nThe comparison additive model was **ETS(A,Ad,A) with Normal errors**, which had a higher **AICc = 6418.296** — a difference of about 19.7 in favor of the multiplicative Gamma model. Additionally, on the low-volume initial 49-observation subsample, the Gamma model produced strictly positive 95% prediction intervals, while the Normal additive model did not.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Gives ETS(M,Md,M) with Gamma, AICc 6398.57, and the additive ETS(A,Ad,A) Normal model with the higher AICc 6418.296, so the multiplicative model is preferred. The subsample remark is extra detail outside the guide."}}, {"code": "K4K4W", "text": "It chose ETS(M,Md,M) with a Gamma distribution, AICc = 6,398.570. The additive ETS(A,Ad,A) with Normal errors had AICc = 6,418.296, so the multiplicative Gamma model was better by about 19.7 AICc points.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Gives the correct model, distribution, both AICc values and the preference for the multiplicative model; the difference of about 19.7 is computed correctly."}}]}, {"text": "Do the paper's results apply to forecast errors more than one step ahead?", "reference": "No results are given for them. The authors focus on one-step-ahead forecast errors; they say the framework is general for h steps ahead and names combining information from several forecast horizons as an interesting extension.", "marking": "Required: no results are shown for forecast errors more than one step ahead; the work focuses on one-step-ahead errors. Also correct: the authors say the framework is general for h steps ahead, and name combining information from several forecast horizons as an extension not yet done; citing the authors' 'without loss of generality' statement, provided the answer says no results for h > 1 are shown. Not required: that the framework is general for h steps ahead. Wrong: saying results were shown for h > 1.", "answers": [{"code": "DE77E", "text": "No. The framework is specifically built on one-step-ahead forecast errors \\(e_t = Y_t - \\hat{y}_t(1)\\), and the theoretical results—[location]—are derived for those errors. Combining information from several forecast horizons is explicitly left as future work.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says no, the results are derived for one-step-ahead errors, and combining several horizons is left as future work; this covers the required content."}}, {"code": "QQMWU", "text": "The paper focuses on one-step-ahead errors but notes the framework is general for h-steps ahead. However, the theoretical results are shown only for the one-step-ahead case; multi-horizon errors are mentioned as future work, not validated.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "States that results are shown only for one-step-ahead errors, that the framework is said to be general for h steps ahead, and that multiple horizons are future work."}}]}, {"text": "Does the paper show the false detection probability staying at or below : the covariances between the multi-step errors cancel the effect, and GPL gives estimates similar to the conventional one-step estimator. Under misspecification it may give different estimates. GPL was not included in the simulations for this reason.", "marking": "Required: No when the model is correctly specified (the covariances cancel the effect, and the estimates are similar to those of the conventional one-step estimator); under misspecification the estimates may differ. Also correct: adding that the General Predictive Likelihood shrinks in small samples and approaches MSE_1 only when T is much larger than h. Not required: that it was left out of the simulations for this reason. Wrong: saying it gives identical estimates in every case, or that it shrinks like MSE_h (overreach).", "answers": [{"code": "W4K3F", "text": "No. When the model is correctly specified, GPL produces estimates similar to MSE₁ with no shrinkage — the covariances between horizons cancel out the effect (det(A) = 1 always). Only under misspecification may GPL estimates differ from MSE₁.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says no under correct specification (covariances cancel, estimates similar to the one-step estimator) and that estimates may differ under misspecification. The parenthetical 'always' is loose but sits inside the correct-specification condition."}}, {"code": "YEWV9", "text": "No — under correct model specification it does not. Maximising the GPL gives estimates similar to MSE₁, because the log-determinant decomposes as \\(\\log GV = h \\log s_1^2 + \\log|\\hat{A}|\\) with \\(|\\hat{A}| = 1\\) when the model is correctly specified, so no extra shrinkage pressure is exerted on the \\(\\hat{c}_j\\).\r\n\r\nCaveats the paper itself notes:\r\n- under misspecification (\\(|\\hat{A}| \\neq 1\\)), off-diagonal covariances don't cancel and GPL estimates diverge from MSE₁.\r\n- GPL approaches MSE₁ only when \\(T\\) is much larger than \\(h\\); in small samples it can shrink even more than MSE₁ (e.g., ETS(A,N,N), \\(T=50\\), \\(h=10\\): 63% of estimates at zero vs 29% for MSE₁).", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says no under correct specification with estimates similar to MSE_1, that they differ under misspecification, and adds the small-sample caveat the guide lists as also correct."}}]}, {"text": "What limitations does the paper itself state of the evidence that the change signalled in the Royal Mail forecast errors marks the start of the Christmas peak season?", "reference": "Only the forecast errors were available: the underlying parcel volumes and the forecasts are unknown to the authors, so the start of the peak season is inferred from the rise in the mean and variance of the forecast errors.", "marking": "Required: at least one limitation from the list below. Limitations the authors state: (1) only the forecast errors were available: the underlying parcel volumes and the forecasts are unknown to the authors; (2) the start of the peak season is inferred from the rise in the mean and variance of the forecast errors; (3) the data are not available. Wrong: saying the authors state no limitations; presenting as the authors' a limitation not in this list (also overreach).", "answers": [{"code": "J4XP9", "text": "The paper doesn't explicitly state limitations for that evidence. It only reports that both detectors signalled on 2 December and that this \"corresponds to a rise in the mean and variance,\" without caveats about alternative explanations or validation.", "judge": {"score": 0, "invented": 0, "overreach": 0, "reason": "Says the paper states no limitations for this evidence, which the marking guide names as wrong."}}, {"code": "UDTU9", "text": "The paper's stated limitation is [location]: the start of the Christmas peak is only *inferred* from the rise in the mean and variance of the forecast errors—the underlying parcel volumes and forecasts are not known to the authors, so the evidence is indirect (reduces precision, no mitigation).", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Gives the listed limitations: the peak start is inferred from the rise in mean and variance of the forecast errors, and the underlying volumes and forecasts are unknown to the authors."}}]}, {"text": "How was the framework applied to the gallstone-related pathology (GRP) admissions data, how quickly did it detect the change, and how does its delay compare with that of a model-based sequential approach?", "reference": "A SARMA(1,0,0)(1,0,0)12 model was fitted to the monthly proportion of GRP A&E admissions up to 2013 and used to produce one-step-ahead forecasts up to 2020. Data from 2013 to 2016 formed the Phase I sample (m = 36), with monitoring from 2016. The mean detector signalled four data points after the changepoint found in the retrospective analysis of Taib et al. (2021), and the squared-error detector two time points after the change. A model-based sequential approach would have a minimum detection delay of 24 months because of the yearly seasonality.", "marking": "Required: the mean detector signals 4 observations after the change and the squared-error detector 2; a model-based sequential approach has a minimum detection delay of 24 months because of the yearly seasonality. Also correct: a SARMA(1,0,0)(1,0,0)12 model fitted to the monthly proportion of GRP A&E admissions up to 2013, giving one-step-ahead forecasts up to 2020; 2013 to 2016 as the training (Phase I) sample, m = 36; monitoring from 2016; the delay of 4 counted from the changepoint found retrospectively by Taib et al. (2021). Not required: the details of the model and the training sample.", "answers": [{"code": "ED4UT", "text": "**Application:** A SARMA(1,0,0)(1,0,0)₁₂ model was fitted to monthly GRP admission proportions (2010–2013), then one-step-ahead forecasts were produced for 2013–2020. The first 36 forecast errors (2013–2016) formed the Phase I sample; both the mean detector (Dμ) and squared-error detector (Dξ) monitored from 2016 onward.\r\n\r\n**Detection speed:** The mean detector signalled 4 observations after the change (July 2017); the squared-error detector signalled 2 observations after (May 2017).\r\n\r\n**Comparison:** Both delays (4 and 2 months) are far shorter than the ≥24 months a model-based sequential detector would need to fit a post-change model with yearly seasonality.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Gives all required points: mean detector 4 observations after the change, squared-error detector 2, and a minimum 24-month delay for a model-based sequential approach due to yearly seasonality. The added calendar dates and 2010 start are not in the reference but do not contradict it."}}, {"code": "WR4TV", "text": "A SARIMA(1,0,0)(1,0,0)₁₂ model was fitted on data up to 2013 and used to generate one-step-ahead forecasts; forecast errors from 2013–2016 served as Phase I training (m = 36), with monitoring from 2016 using both D_μ and D_ξ.\r\n\r\nD_μ detected the change 4 data points after the changepoint identified by Taib et al. (2021); D_ξ detected it 2 time points after the change. A model-based sequential approach would have a minimum delay of 24 months due to yearly seasonality, so the framework was much faster.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "States the 4-point and 2-point delays, the 24-month minimum delay from yearly seasonality, and the correct model orders, Phase I sample and monitoring start. Calling the model SARIMA rather than SARMA is the same specification."}}]}, {"text": "What evidence supports the claim that PIC(LS,S,N) is one of the most robust variants, and what limitations of this evidence does the paper itself state?", "reference": "In the simulation the PIC(*,S,N) methods have rMAE close to that of the correct method on data from every DGP, being only slightly less accurate, and in pinball values they are robust compared with the other methods: worse than the correct method on the most flexible data, but less so than PIC(*,S,S), and better than the flexible methods on the most restrictive data. With 50 series of common seasonality, PIC(LS,S,N) has a 35% lower pinball value than PIC(N,N,N). On the M5 data it was the restriction chosen most often (6 of 11 groups), which the authors say validates the simulation finding. Limitations the authors state: the PIC(*,S,N) methods are outperformed by the flexible PIC(*,N,N) methods when the data favour those, so they suit series with similar seasonal patterns; and the simulated smoothing parameters cover a restricted range, not the whole parameter space.", "marking": "Required: the simulation evidence that the PIC(*,S,N) methods have rMAE close to that of the correct method on data from every data generating process, and that on the M5 data PIC(LS,S,N) was the restriction chosen most often (6 of 11 groups). Not required: the pinball results; the 35% lower pinball value than PIC(N,N,N) with 50 series; that the authors say the M5 selection validates the simulation finding; any limitation. Wrong: saying PIC(*,S,N) has lower pinball values than every method except the correct one. Acceptable limitations: the PIC(*,S,N) methods are outperformed by the flexible PIC(*,N,N) methods when the data favour those, so they suit series with similar seasonal patterns; the simulated smoothing parameters cover a restricted range, not the whole parameter space; the simulation covers only VETS(M,N,M;LN) on quarterly data; models with a trend are not analysed; whether the restrictive variants work on histories as short as about one year is not known; groups of more than 50 series were not tested; robustness outside the simulated settings is not tested; how often a restriction is selected does not itself measure its robustness; the empirical evidence is one data set of 69 series in 11 groups, each evaluated on a single 12-month holdout; the non-seasonal groups are few and small, so no reliable conclusion can be drawn about the restrictions chosen for them. Limitations: correct if the answer gives limitations from this list or says the authors state none. Wrong: presenting as the authors' a limitation not in this list (also overreach).", "answers": [{"code": "AQPXQ", "text": "**Evidence:**\r\n- **Point accuracy:** PIC(LS,S,N) stays close to the correct variant in rMAE on data from every generating variant (1.00–1.06, vs up to 1.7 for PIC(*,S,S) and up to 1.07 for PIC(*,N,N) on mismatched data).\r\n- **Prediction intervals:** Among the lowest rPinballU values across all data-generating processes (0.89–1.26, vs up to 2.05 for PIC(*,S,S) and 1.39 for PIC(N,N,N)).\r\n- **Corroboration on real data:** The selection procedure chose PIC(LS,S,N) most often on the M5 data (6 of 11 groups).\r\n\r\n**Limitations the paper states:**\r\n- Robustness is only shown in simulation; it is **not tested outside the simulated settings**.\r\n- The simulation covers only VETS(M,N,M;LN), quarterly data, smoothing parameters from restricted ranges.\r\n- Groups of more than 50 series were not tested.\r\n- Models with a trend component are not analysed.\r\n- Whether the findings hold for histories as short as about one year is unknown.\r\n- Selection frequency on M5 does not measure robustness as such, and the M5 evidence is a single data set of 69 series with one 12-month holdout.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Gives both required pieces of evidence (rMAE close to the correct method on every DGP; chosen most often on M5, 6 of 11 groups). All the limitations it lists are in the accepted list, and it does not make the wrong pinball claim."}}, {"code": "HUTQW", "text": "**Evidence for robustness of PIC(LS,S,N):**\r\n\r\n- **Simulation, point forecasts:** It performs well across all nine DGPs — never far from the correct method's rMAE, and much better than PIC(*,S,S) when DGPs are flexible (top-right corners), while only slightly worse than flexible methods on restrictive DGPs.\r\n- **Simulation, prediction intervals:** Consistently strong rPinballU across DGPs; e.g. on flexible DGPs it achieves ~1.19–1.26 vs ~1.7–2.0 for PIC(*,S,S) methods. With 50 series its pinball is ~35% lower than the benchmark.\r\n- **Group size:** Benefits grow with group size, stabilising after ~10 series.\r\n- **Empirical validation:** Auto-selection chose PIC(LS,S,N) in 6 of 11 M5 groups — the most frequent restriction — and the paper states this \"validates our simulation findings.\"\r\n\r\n**Limitations the paper itself states:**\r\n\r\n- Simulation covers only **VETS(M,N,M;LN)** — no trend, quarterly seasonality (monthly checked separately), uncorrelated errors in the main experiment; correlated errors tested only in a small side experiment (groups of 2 and 10).\r\n- Smoothing parameter ranges were restricted (α ∈ [0,0.3], γ ∈ [0,1−α]), not the full parameter space.\r\n- Robustness holds \"as long as the time series exhibit similar seasonal patterns\"; if seasonality differs substantially, individual-component methods PIC(*,N,N) are needed instead.\r\n- The M5 evidence is aggregated monthly department-store data; higher-frequency (weekly/daily) behaviour is untested and flagged as future work.", "judge": {"score": 0.5, "invented": 1, "overreach": 1, "reason": "Required evidence is present and several limitations are accepted ones. It also presents as the authors' limitations not in the accepted list (correlated errors tested only in a small side experiment; higher-frequency data untested and flagged as future work), which the marking guide marks as wrong and as overreach."}}]}, {"text": "Which statistical test did the paper use to find that the differences in mean scaled pinball score are not significant at the 5% level?", "reference": null, "marking": "Required: says the authors do not report this (any wording). Wrong: giving an answer as the authors'. A nearby statement, that the differences are not significant at the 5% level, does not answer it: no test is named.", "answers": [{"code": "WE9CW", "text": "The paper doesn't name the test. [location] explicitly notes \"the test is not named in the paper.\"", "judge": {"score": 1, "invented": 1, "overreach": 0, "reason": "Correctly says the paper does not name the test. Invented is set because it attributes to the paper an explicit quoted statement ('the test is not named in the paper') that the paper would not contain."}}, {"code": "37DWN", "text": "The paper does not name a specific statistical test. It only says the differences were “not statistically significant (on 5% significance level).”", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Correctly says no specific test is named, citing only the nearby non-significance statement."}}]}, {"text": "How were the data generated in the simulation experiment?", "reference": "With sim.ves() from the legion package: VETS(A,N,A) data exponentiated to give VETS(M,N,M;LN), from each of the nine PIC variants studied. Quarterly seasonality (m = 4), 24 or 64 observations (6 or 16 years) with the last 8 held out, groups of 2, 10, 20, 30, 40 and 50 series, initial level from [4, 10], seasonal indices from (−1, 1) normalised, independent normal errors with standard deviation 0.3, smoothing parameters set by variant (α = 0.3 and γ = 0.1 for PIC(LS,*,*); α in [0, 0.3] and γ = 0.1 for PIC(S,*,*); α in [0, 0.3] and γ in [0, 1 − α] for PIC(N,*,*)), and 1000 iterations.", "marking": "Required: the model, VETS(M,N,M;LN) (VETS(A,N,A) data exponentiated); quarterly data; the two sample lengths, 24 and 64 observations; the group sizes 2, 10, 20, 30, 40 and 50 series. Not required: the generating function (sim.ves() from legion), the nine PIC variants used to generate data, the 8-observation holdout, the initial level and seasonal indices, the error standard deviation 0.3, the smoothing parameters, the 1000 iterations. Wrong: another model, frequency, sample length or group size.", "answers": [{"code": "XEAE4", "text": "**Data generation:** Groups of 2, 10, 20, 30, 40 or 50 quarterly series of 24 or 64 observations were generated with `sim.ves` from the legion package 0.1.0, from each of the nine PIC variants of VETS(M,N,M;LN) (i.e., VETS(A,N,A) data exponentiated):\r\n\r\n- Initial level drawn from [4, 10]\r\n- Seasonal indices drawn from (−1, 1) and normalised\r\n- Independent normal errors with standard deviation 0.3\r\n- Smoothing parameters by variant:\r\n - PIC(LS,*,*): α = 0.3, γ = 0.1\r\n - PIC(S,*,*): α ∈ [0, 0.3], γ = 0.1\r\n - PIC(N,*,*): α ∈ [0, 0.3], γ ∈ [0, 1 − α]\r\n\r\n1000 iterations; the last 8 quarters held out for forecasting.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Gives the model (VETS(A,N,A) exponentiated to VETS(M,N,M;LN)), quarterly data, 24 or 64 observations and group sizes 2 to 50, plus correct optional details matching the reference."}}, {"code": "YHUUY", "text": "Data were generated using the `sim.ves` function from the R package **legion v0.1.0**. The underlying process was **VETS(A,N,A)**, then exponentiated to obtain **VETS(M,N,M;LN)** (pure multiplicative, log-normal errors).\r\n\r\nKey setup:\r\n- **Seasonal cycle:** quarterly, $m=4$ (monthly also checked, similar findings)\r\n- **Initial level:** random from [4,10] in logs → [54, 22000] in data scale\r\n- **Seasonal indices:** random from (−1,1), normalised → multiplicative indices in (0.37, 2.72)\r\n- **Sample sizes:** $T = 24$ or $64$ quarters (6 or 16 years), last 8 quarters (2 years) as holdout\r\n- **Group sizes:** $n = 2, 10, 20, 30, 40, 50$ series\r\n- **Errors:** i.i.d. normal with $\\sigma = 0.3$ (log-normal after exponentiation), uncorrelated across series\r\n- **Smoothing parameters:** varied by PIC restriction — e.g. $\\alpha=0.3, \\gamma=0.1$ for PIC(LS,*,*); $\\alpha \\in [0,0.3], \\gamma \\in [0,1-\\alpha]$ for PIC(N,*,*)\r\n- **Replications:** 1000 iterations", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "All required elements are correct (model, quarterly, 24/64 observations, group sizes), and the extra details agree with the reference or are correct transformations of it."}}]}, {"text": "Why does the paper hold that the covariances between forecast errors at different horizons are not zero?", "reference": "The authors express each covariance through the coefficients c_j of the state space model (σ_ij = σ_1²c_{|i−j|} when i or j is 1, and σ_1²(c_{|i−j|} + Σ c c) otherwise), so all covariances vanish only when every c_j = 0, a deterministic model. Assuming zero correlation, as some literature does (Martinez 2017), is therefore unrealistic.", "marking": "Required: each covariance is expressed through the coefficients c_j of the state space model, so all covariances vanish only when every c_j = 0 (a deterministic model); assuming zero correlation is therefore unrealistic. Also correct: either form of the covariance formula: σ_ij = σ_1²c_{|i−j|} when i or j is 1 and σ_1²(c_{|i−j|} + Σ_{l=1}^{i−1} c_{|l−j|}c_{|i−l|}) otherwise; or, for i < j, σ_ij = σ_1²(c_{j−i} + Σ_{l=1}^{i−1} c_{i−l}c_{j−l}) with σ_ji = σ_ij. Also correct: adding that TMSE has no likelihood for which it is optimal, or that TMSE is the maximum likelihood estimator when the errors of all horizons are independent with equal variances. Not required: the formula in detail; what follows for TMSE.", "answers": [{"code": "CQXRR", "text": "Because the errors share common innovation terms. From the state space model, the h-step-ahead error is η_{t+h|t} = Σ_{j=1}^{h-1} c_j ε_{t+j} + ε_{t+h}, so errors at different horizons contain overlapping ε terms. The covariance σ_{i,j} is a function of the c_j parameters and equals zero only if all c_j = 0 — i.e., only for a deterministic model. Hence assuming zero off-diagonal covariances (as in TMSE, or in Martinez 2017) is unrealistic for any stochastic model.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "States that the covariances depend on the c_j coefficients, vanish only when all c_j = 0 (a deterministic model), and that assuming zero covariance is therefore unrealistic."}}, {"code": "C7RDF", "text": "Because the errors share the same innovations. From [location]:\r\n\r\n$$\\eta_{t+h|t} = \\sum_{j=1}^{h-1} c_{h-j}\\, \\epsilon_{t+j} + \\epsilon_{t+h}$$\r\n\r\nErrors at different horizons made at time \\(t\\) overlap in the \\(\\epsilon_{t+j}\\) terms, giving covariance:\r\n\r\n$$\\sigma_{i,j} = \\sigma_1^2 \\left( c_{j-i} + \\sum_{l=1}^{i-1} c_{i-l}\\, c_{j-l} \\right), \\quad 1 \\le i < j$$\r\n\r\nwhich is zero only if every \\(c_j = 0\\). This contradicts Martinez (2017), who assumed zero correlation between multi-step forecast errors.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Gives the accepted covariance formula and that it is zero only if every c_j = 0, contradicting the zero-correlation assumption of Martinez (2017). It does not use the word 'deterministic', but the substance is there."}}]}, {"text": "According to the paper, what change size Δ_μ,m appears in the forecast errors of a perfectly specified AR(1) forecasting model after a change of size δ_μ,m in the mean of the raw data?", "reference": "Δ_μ,m = δ_μ,m(1 − φ), where φ is the autoregressive parameter.", "marking": "Required: Δ_μ,m = δ_μ,m(1 − φ), with φ the autoregressive parameter. Also correct: δ_μ,m at the first post-change point, then δ_μ,m(1 − φ) from the next point on; deriving the AR(1) case from the general ARMA formula Δ_μ,m = δ_μ,m(1 − Σφ_j)Σψ_l(θ), with the expansion of 1/θ(z) written either as Σψ_l(θ) z^l or as Σψ_l(θ). Not required: the general ARMA formula.", "answers": [{"code": "THMT4", "text": "For an AR(1) model, φ₁ = φ and θ = 1, so ψ₀ = 1 and ψₗ = 0 for l ≥ 1. The formula of [location] gives:\r\n\r\nΔ_μ,m = δ_μ,m (1 − φ)\r\n\r\nSo the mean change in the forecast errors is the raw-data mean change scaled by one minus the autoregressive coefficient.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Derives the AR(1) case from the general ARMA formula and reaches Δ_μ,m = δ_μ,m(1 − φ), with φ the autoregressive coefficient, which the guide accepts."}}, {"code": "V3XV3", "text": "Δ_μ,m = δ_μ,m(1 − φ).", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Gives the required formula Δ_μ,m = δ_μ,m(1 − φ)."}}]}, {"text": "How accurate were pure multiplicative ETS models with the Gamma distribution on intermittent demand data in this paper's experiments?", "reference": null, "marking": "Required: says the authors do not report this (any wording). Wrong: giving an answer as the authors'. A nearby statement, that other work (Svetunkov and Boylan, 2023) used pure multiplicative ETS on intermittent data and found it worked well, does not answer it; citing it as other work is correct, presenting it as a result of this work is wrong.", "answers": [{"code": "9NK4K", "text": "The paper doesn't test intermittent demand data. Its real-life demonstration uses a daily EV charging series (511 observations, continuous demand with 7-day seasonality), where the Gamma ETS(M,Md,M) achieved AICc 6398.57 (vs 6418.296 for additive Normal ETS) and strictly positive 95% prediction intervals on the low-volume subsample. The simulations use regular, non-intermittent synthetic series.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says the paper does not test intermittent demand data, and gives no accuracy result for it as the paper's; the extra detail concerns the non-intermittent experiments."}}, {"code": "7FT3P", "text": "The paper does not report experiments on intermittent demand. It only cites Svetunkov & Boylan (2023) as showing multiplicative ETS can work well there.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says the paper reports no experiments on intermittent demand, and correctly attributes the nearby statement to Svetunkov and Boylan (2023) as other work."}}]}, {"text": "What evidence does the paper give that including CES improves the SCUM combination, and is there any measure on which it does not?", "reference": "SCUM (with CES) is compared with SCUM(noCES). On the M1, M3 and tourism data SCUM has lower mean and median RMSSE and MASE (e.g. mean RMSSE 1.867 vs 1.911) and lower median MSIS, and in Nemenyi tests it is significantly better than every other approach, SCUM(noCES) included. On M4 SCUM is lower on every reported measure. The exception is mean MSIS on the M1, M3 and tourism data, where SCUM (2.333) is worse than SCUM(noCES) (2.223).", "marking": "Required: the comparison of SCUM (with CES) against SCUM(noCES): SCUM has lower errors on most measures on the M1, M3 and tourism data and on every reported measure on the M4 data; and the exception: mean MSIS on the M1, M3 and tourism data, where SCUM (2.333) is worse than SCUM(noCES) (2.223). Also correct: that on Nemenyi ranks SCUM is significantly better than every other approach, SCUM(noCES) included, on every measure, MSIS included, given together with the mean MSIS exception. Not required: the other values (e.g. mean RMSSE 1.867 against 1.911). Wrong: saying SCUM is better on every measure without the mean MSIS exception.", "answers": [{"code": "YTPXJ", "text": "**Evidence:**\r\n\r\n- **M1/M3/tourism:** SCUM (median of ETS, ARIMA, Theta, CES) vs SCUM(noCES): mean RMSSE 1.867 vs 1.911, mean MASE 2.146 vs 2.191, median RMSSE 1.128 vs 1.143, median MASE 1.256 vs 1.279, median MSIS 0.844 vs 0.859 — all lower with CES. Nemenyi tests: SCUM significantly better than every other method including SCUM(noCES) on all three measures.\r\n- **M4:** SCUM vs SCUM(noCES): mean MASE 2.737 vs 2.784, mean RMSSE 2.198 vs 2.241, mean MSIS 1.751 vs 1.798, and all medians lower with CES.\r\n\r\n**Exception:** On M1/M3/tourism, SCUM's **mean MSIS is higher with CES** (2.333 vs 2.223) — the only measure on which adding CES does not improve the combination.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Gives the SCUM against SCUM(noCES) comparison on both datasets, the Nemenyi result, and the mean MSIS exception (2.333 against 2.223)."}}, {"code": "VF4DF", "text": "Evidence: on M1/M3/tourism, SCUM beats SCUM(noCES) on mean and median RMSSE and MASE; on M4, SCUM also beats SCUM(noCES) on mean/median MASE and RMSSE. The Nemenyi test says SCUM is significantly better than SCUM(noCES) across all error measures.\r\n\r\nException: on M1/M3/tourism mean MSIS, SCUM(noCES) is better (2.223 vs 2.333), because CES can fail badly on some series.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Gives the comparison on both datasets, the Nemenyi result, and the mean MSIS exception with the correct values; it does not mention MSIS on M4, but states nothing wrong."}}]}, {"text": "What supports the claim that CES can model both stationary and non-stationary series without a model selection step, and what limitations of this evidence does the paper itself state?", "reference": "The eigenvalues of the CES transition matrix show that the model is stationary or not depending on α0 and α1 (non-stationary when α1 > 1), passing between the two without a switch. Two M3 series illustrate it: on a stationary series (1664) CES estimated a stationary parameter, on a trended one (2721) a non-stationary one. The authors state no limitation of this evidence.", "marking": "Required: stationarity of CES depends on α0 and α1 through the eigenvalues of its transition matrix (non-stationary when α1 > 1), so the model passes between stationary and non-stationary without a switch; and the two M3 examples: on a stationary series (1664) CES estimated a stationary parameter, on a trended series (2721) a non-stationary one. Not required: the series numbers; giving limitations. Limitations the authors state: none. Limitations: correct if the answer gives limitations from this list or says the authors state none. Wrong: presenting as the authors' a limitation not in this list (also overreach).", "answers": [{"code": "7TEFC", "text": "**Support:**\r\n\r\n- **Theoretical:** CES is stationary or non-stationary depending on its complex smoothing parameter, moving continuously between the two as the parameter changes; no separate model choice is needed. At α₁ = 1 it equals ETS(A,N,N), and its five forecast trajectories cover flat, growing, declining and oscillating paths.\r\n- **Empirical:** On M3 series 1664 (stationary per ADF/KPSS), CES estimated a stationary parameter (0.99999 + 0.99884i); on trended series 2721, a non-stationary one (1.48098 + 1.00346i). On the M1/M3/tourism data, CES beat ETS, ARIMA and Theta on most measures, and on the non-seasonal subset it beat level and multiplicative-trend ETS models.\r\n\r\n**Limitations the paper states:**\r\n\r\n- Stationarity is not imposed — parameters are not restricted to the stationary region, so estimation can land anywhere.\r\n- CES is required only to be stable or forecastable; the stable region contains both stationary and non-stationary values.\r\n- The stability conditions for **seasonal** CES are not derived.\r\n- The effect of series length on accuracy is not analysed.\r\n- Robustness is claimed but not defined or tested across conditions.\r\n- CES can fail on individual series (e.g., M1 series 47).", "judge": {"score": 0.5, "invented": 1, "overreach": 1, "reason": "The support is right: stationarity depends on the complex parameter with no switch, and the two M3 examples have stationary and non-stationary estimates. But it lists several limitations as stated by the paper, whereas the authors state none, which the marking guide marks as wrong and as overreach."}}, {"code": "TE3YJ", "text": "Support:\r\n- Theory: the stationarity of CES depends on the complex smoothing parameter $\\alpha_0+i\\alpha_1$, with the stationarity region derived in [location], so one model covers both cases.\r\n- Demonstrations: M3 series 1664 is stationary and 2721 is trended/non-stationary, and CES fits both with appropriate parameters.\r\n- Empirics: CES performs well on competition data containing both types of series.\r\n\r\nLimitations stated by the paper:\r\n- It does not claim CES is appropriate for every forecasting scenario.\r\n- The work focuses on the additive error case; multiplicative error and sample-size effects are left to future research.", "judge": {"score": 0.5, "invented": 1, "overreach": 1, "reason": "The support is given only loosely (no eigenvalue or α1 > 1 condition, and 'appropriate parameters' rather than a stationary and a non-stationary estimate). It also presents limitations as stated by the paper, whereas the authors state none, so both flags are set."}}]}, {"text": "How were the simulation experiments designed?", "reference": "Two data generating processes, ETS(A,N,N) with α = 0.2 and ARIMA(0,1,1) with θ = 0.6, each giving 500 series of 5,000 observations, of which sub-samples of 20, 50, 100, 200, 500, 1,000 and 5,000 observations were used. Four models were fitted (ETS(A,N,N), ETS(A,A,N), ARIMA(0,1,1), ARIMA(1,1,1)) with MSE_h, TMSE, GTMSE, MSCE and the conventional MSE_1, for horizons 10, 20, 50, 100 and 200, skipping cases where the sample was not longer than the horizon (smooth package v2.5.3). GPL was not included.", "marking": "Required: the two data generating processes (ETS(A,N,N) with α = 0.2 and ARIMA(0,1,1) with θ = 0.6), the sample sizes (20, 50, 100, 200, 500, 1,000 and 5,000) and the horizons (10, 20, 50, 100 and 200). Not required: the other details of the reference answer.", "answers": [{"code": "ATF7D", "text": "**Design:**\r\n- **Data-generating processes:** 500 series of length 5,000 each from ETS(A,N,N) (α = 0.2) and ARIMA(0,1,1) (θ = 0.6).\r\n- **Sample sizes:** sub-samples T ∈ {20, 50, 100, 200, 500, 1000, 5000}.\r\n- **Horizons:** h ∈ {10, 20, 50, 100, 200}.\r\n- **Fitted models:** four — ETS(A,N,N), ETS(A,A,N), ARIMA(0,1,1), ARIMA(1,1,1) (the latter two cases fitting over-parameterised/misspecified models to the DGPs).\r\n- **Estimators:** five — MSE₁, MSE_h, TMSE, GTMSE, MSCE.\r\n- **Software:** R package smooth v2.5.3 (sim.es, sim.ssarima, es, ssarima).\r\n- **Evaluation:** parameter estimation bias and dispersion via boxplots over the 500 replications.\r\n\r\n**Limitation:** only two univariate DGPs and pure additive linear models; results reported visually, not as tabulated statistics.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Gives both DGPs with their parameters, the sample sizes and the horizons. The fitted models, estimators and software match the reference."}}, {"code": "MF4JA", "text": "Two simulation experiments:\r\n\r\n**Design common to both:**\r\n- 500 time series of 5000 observations each\r\n- Sub-samples of 20, 50, 100, 200, 500, 1000, 5000 observations to assess sample-size effects\r\n- Four models fitted: ETS(A,N,N), ETS(A,A,N), ARIMA(0,1,1), ARIMA(1,1,1) — covering true, analogous, misspecified, and wrong models\r\n- Five estimators: MSE₁, MSE_h, TMSE, GTMSE, MSCE\r\n- Forecast horizons h = 10, 20, 50, 100, 200 (estimation skipped if T ≤ h)\r\n- Estimation via the smooth package (v2.5.3) in R\r\n\r\n**DGPs:**\r\n1. ETS(A,N,N) with α = 0.2\r\n2. ARIMA(0,1,1) with θ = 0.6\r\n\r\nNote: θ = α − 1 links the two DGPs, so the ETS and ARIMA \"true\" models are analogous. GPL was excluded from the simulations.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Gives both DGPs with their parameters, all seven sample sizes and all five horizons. The further details match the reference."}}]}, {"text": "What evidence supports the finding that common smoothing parameters improve forecasts, and what limitations of this evidence does the paper itself state?", "reference": "In the simulation, within each block of methods the pinball values improve as smoothing parameters are made common (PIC(LS,*,*) better than PIC(S,*,*), better than PIC(N,*,*)) on data from every DGP, and rMAE improves slightly with them on data from PIC(LS,S,S). On the M5 data the selection chose common smoothing parameters for most groups, and the authors say the parameters, particularly for level and seasonality, benefited from common estimation. Limitations the authors state: on data generated with individual parameters (PIC(N,N,N)), restricting them lowers point accuracy, though not substantially; the simulated smoothing parameters cover a restricted range, not the whole parameter space; and additional seasonal indices and the trend element, not studied, may change how the methods behave.", "marking": "Required: the simulation result that, within each block of methods, making smoothing parameters common lowers pinball values (PIC(LS,*,*) better than PIC(S,*,*), better than PIC(N,*,*)) on data from every data generating process. Not required: that rMAE improves slightly with common parameters on data from PIC(LS,S,S); that the selection on the M5 data chose common smoothing parameters for most groups; any limitation. Acceptable limitations: on data generated with individual parameters (PIC(N,N,N)), restricting the smoothing parameters lowers point accuracy, though not substantially; the simulated smoothing parameters cover a restricted range, not the whole parameter space; the simulation covers only VETS(M,N,M;LN) on quarterly data; models with a trend are not analysed, and additional seasonal indices or the trend element may change how the methods behave; whether the restrictive variants work on histories as short as about one year is not known; groups of more than 50 series were not tested; whether common smoothing parameters reduce overfitting because they are averaged across series is not established. Limitations: correct if the answer gives limitations from this list or says the authors state none. Wrong: presenting as the authors' a limitation not in this list (also overreach).", "answers": [{"code": "EAYUJ", "text": "**Evidence:**\r\n- Simulation [location] (16 in-sample quarters): for every pair of variants differing only in smoothing parameters, the one with more common parameters has rPinballU at or below the other, on data from every generating variant — e.g., PIC(LS,S,N) ≤ PIC(S,S,N) ≤ PIC(N,S,N) in rPinballU on each column.\r\n- The effect extends to point accuracy: PIC(*,S,N) and PIC(LS,N,N) stay close to the correct variant in rMAE, and common parameters help most on short histories (rPinballU 0.86 for PIC(LS,S,N) vs 1.02 for PIC(N,S,N) at 16 quarters).\r\n- Corroboration on M5: the selection procedure most often chose common level and seasonal smoothing parameters (PIC(LS,S,N), 6 of 11 groups), and the authors attribute VETS's accuracy gains mainly to shared seasonal initial values and smoothing parameters.\r\n\r\n**Limitations the paper states:**\r\n- Findings rest on simulation of VETS(M,N,M;LN) only, quarterly data, smoothing parameters drawn from restricted ranges not covering the full parameter space.\r\n- Whether common parameters help on histories as short as about one year is unknown.\r\n- Groups of more than 50 series were not tested.\r\n- No trend-component models were analysed.\r\n- Whether the benefit comes from reduced overfitting (averaging parameters across series) is not established.\r\n- Whether findings hold for monthly seasonality, lower error standard deviations, or cross-correlated errors is not shown — the paper mentions similar results without reporting them.\r\n- On M5, no experiment compares VETS with and without these restrictions directly, and the MCB differences are not statistically significant.", "judge": {"score": 0.5, "invented": 1, "overreach": 1, "reason": "The required simulation evidence is present and several limitations are acceptable. It also presents as the authors' limitations not in the guide's list (monthly seasonality, error standard deviations and cross-correlated errors not shown; no direct M5 comparison; MCB differences not significant), which the guide marks wrong and overreach."}}, {"code": "QCCVV", "text": "**Evidence from the simulation experiment:**\r\n\r\n- Within each block of methods, restricting smoothing parameters improves accuracy and pinball values monotonically: PIC(LS,*,*) outperforms PIC(S,*,*), which outperforms PIC(N,*,*) — regardless of the DGP. E.g. for rPinballU on flexible DGPs, PIC(LS,S,N) ≈ 1.19–1.26 vs PIC(N,S,N) ≈ 1.65–1.70.\r\n- The benefit is attributed to parsimony: common parameters are \"averaged out\" across series, protecting against overfitting — especially with larger groups and shorter histories.\r\n- On M5, the auto-selected restrictions were mostly PIC(LS,S,N) (6 of 11 groups), corroborating that common level+seasonal smoothing parameters work well empirically.\r\n\r\n**Limitations the paper itself states:**\r\n\r\n- The simulation range for smoothing parameters was restricted (α ∈ [0,0.3], γ ∈ [0,1−α]), not covering the whole parameter space.\r\n- The finding is demonstrated for VETS(M,N,M;LN) only — no trend component, quarterly seasonality mainly (monthly checked separately with similar findings), uncorrelated errors in the main experiment.\r\n- Common parameters help *given the correct model class*; if the DGP is very different (e.g. flexible PIC(N,N,N) data), restrictive methods still lose accuracy, so common parameters cannot compensate for a wrongly restricted component structure.\r\n- The evidence is specific to the pure multiplicative (log-normal) framework; additive models were not tested in the simulation.", "judge": {"score": 0.5, "invented": 1, "overreach": 1, "reason": "The required simulation evidence is present and some limitations are acceptable. It presents as the authors' limitations not in the guide's list (additive models not tested, uncorrelated errors) and states the overfitting explanation as the paper's attribution although the guide says it is not established."}}]}, {"text": "When do common seasonal components (PIC(*,S,S)) help forecast accuracy, and when do they harm it?", "reference": "They help only when the series share very similar seasonal patterns. In the simulation they do well on data with common seasonal components, with moderate gains over PIC(N,N,N), though no better than common initial seasonal indices with individual components (PIC(*,S,N)). On data with individual seasonal components and initial values (the most flexible DGPs) they are much worse than the correct method in accuracy and do poorly in pinball values. The authors recommend them only for homogeneous series; on the M5 data they were chosen for only one of the 11 groups.", "marking": "Required: they help only for series with very similar seasonal patterns, and they harm accuracy on data with individual seasonal components (and individual initial values). Also correct: they bring no gain over common initial seasonal indices with individual components (PIC(*,S,N)), even on data with common seasonality; they give moderate gains over PIC(N,N,N) on data with common seasonal components; they do poorly in pinball values on the most flexible data. Not required: that on the M5 data they were chosen for only one of the 11 groups. Wrong (overreach): saying common seasonal components improve accuracy in general.", "answers": [{"code": "43YRN", "text": "**Help:** When the series truly share a seasonal pattern (data from PIC(*,S,S) variants), PIC(*,S,S) variants are the most accurate — e.g., rMAE ≈ 0.95 vs 1.0 for the correct PIC(N,N,N) on common-seasonality data.\r\n\r\n**Harm:** When series have individual seasonal components, forcing a common one is very damaging — rMAE rises to 1.55–1.88 on PIC(N,N,N) data, vs ≈1.0–1.02 for PIC(*,S,N). Hence the recommendation: use common seasonal components only for very similar seasonal patterns.", "judge": {"score": 0.5, "invented": 0, "overreach": 0, "reason": "Has both required points, but adds that PIC(*,S,S) variants are 'the most accurate' on common-seasonality data, whereas the reference says they are no better than PIC(*,S,N) there."}}, {"code": "P9NK7", "text": "**When they help:**\r\n- When the data-generating process truly has common seasonality (PIC(*,S,S) DGPs), the restrictive methods perform well — e.g. rMAE ≈ 0.95–0.98 vs benchmark when applied to PIC(LS,S,S) data, with gains growing as group size increases (up to ~35% lower pinball for 50 series).\r\n- Benefits are greatest with **short data histories** and **larger groups**, where pooling compensates for few observations per series.\r\n\r\n**When they harm:**\r\n- When the DGP has individual seasonal components (flexible DGPs like PIC(*,N,N)), common seasonal components perform very poorly — rMAE up to **1.7–1.9** and pinball values up to **2.0**, i.e. roughly double the error. The top-right corners of the simulation tables show the worst degradation.\r\n- The harm comes from imposing a shared seasonal pattern on series that genuinely differ, biasing all series in the group toward an \"average\" seasonality that fits none well.\r\n\r\n**Practical guidance from the paper:** apply PIC(*,S,S) only to highly homogeneous series with very similar seasonal shapes; otherwise use PIC(*,S,N) (individual seasonal components with common initials/parameters), which is nearly as good when seasonality is common and far more robust when it is not.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says they help only for highly homogeneous series with very similar seasonal shapes and harm accuracy and pinball values on data with individual seasonal components, and notes PIC(*,S,N) does about as well on common-seasonality data."}}]}, {"text": "At what significance level was the MCB test on the rMAE of the M5 forecasts conducted?", "reference": null, "marking": "Required: says the authors do not report this (any wording). Wrong: giving an answer as the authors'.", "answers": [{"code": "C9FA4", "text": "The paper does not state the significance level of the MCB test. It only reports that the differences between the five models were not shown to be statistically significant.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says the paper does not state the significance level of the MCB test."}}, {"code": "EPWRX", "text": "The paper does not state the significance level. It only reports that VETS F (long history) had the lowest mean rank but was **not statistically different** from VETS D, ETS LN, ETS (ADAM), ETS (long), and VETS D (short) — without specifying the alpha level used in the MCB test (Koning et al., 2005).", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says the paper does not state the significance level. The surrounding detail does not supply a level."}}]}, {"text": "How many hospitals contributed to the GRP admissions data?", "reference": null, "marking": "Required: says the authors do not report this (any wording). Wrong: giving an answer as the authors'.", "answers": [{"code": "WHD7R", "text": "The paper doesn't say — it only mentions \"a number of participating hospitals across England,\" with no specific count given.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says the paper gives no specific count of hospitals."}}, {"code": "MXPQM", "text": "The paper doesn't say. [location] only describes the data as the monthly proportion of GRP A&E admissions \"in participating hospitals across England\"—no hospital count is given.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says the paper gives no hospital count."}}]}, {"text": "What complex smoothing parameter did CES estimate on M3 series 1664, and what did the authors conclude from it?", "reference": "α0 + iα1 = 0.99999 + 0.99884i. It satisfies the stationarity condition, so the model produces a stationary trajectory: CES identified the series as stationary, in agreement with graphical analysis and the ADF and KPSS tests. The implied ARMA is stationary with long memory, and all holdout observations lay inside the 95% prediction interval.", "marking": "Required: α0 + iα1 = 0.99999 + 0.99884i, and that it indicates a stationary model (CES identified the series as stationary). Not required: the stationarity condition it satisfies; the implied ARMA parameters (stationary, with long memory); the agreement with graphical analysis and the ADF and KPSS tests; that all holdout observations lay inside the 95% prediction interval.", "answers": [{"code": "R93XY", "text": "For M3 series 1664, CES estimated $\\alpha_0+i\\alpha_1=0.99999+0.99884i$. The authors concluded that CES identified the series as stationary and produced a stationary trajectory.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Gives the correct parameter 0.99999 + 0.99884i and the conclusion that CES identified the series as stationary."}}, {"code": "KNFQ4", "text": "On M3 series 1664, CES estimated **α₀ + iα₁ = 0.99999 + 0.99884i**.\r\n\r\nSince graphical analysis and the ADF and KPSS tests indicate the series is stationary, the authors concluded that CES estimated a parameter in its **stationary region** — with α₁ ≈ 1, close to the ETS(A,N,N)/simple exponential smoothing case.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Gives the correct parameter and says it lies in the stationary region, in agreement with the graphical analysis and the ADF and KPSS tests. The remark about closeness to ETS(A,N,N) does not contradict the reference."}}]}, {"text": "What restrictions does the paper place on the parameters of the Inverse Gaussian, Log-Normal and Gamma distributions of the error term 1 + ϵt in ETS(M,*,*) models, and why?", "reference": "The expectation of 1 + ϵt must equal 1: for the Inverse Gaussian μ = 1, for the Log-Normal μ = −σ²/2, and for the Gamma the shape ξ = 1/σ². This guarantees that the one-step-ahead point forecast equals the expectation of the model, which the construction of the model needs (fitted values are the one-step-ahead forecasts that start the recursion).", "marking": "Required: the expectation of 1 + ϵt must equal 1, and the restriction for each distribution: Inverse Gaussian μ = 1; Log-Normal μ = −σ²/2; Gamma shape ξ = 1/σ². Not required: the reason (that it makes the one-step-ahead point forecast equal the expectation of the model, which the construction of the model needs). Wrong: a wrong restriction for any of the three distributions.", "answers": [{"code": "Q4PY9", "text": "They impose E(1 + εt) = 1 so one-step forecasts match conditional expectations.\r\n\r\n- Inverse Gaussian: location μ = 1.\r\n- Log-Normal: location μ = −σ²/2.\r\n- Gamma: shape ξ = 1/σ².\r\n\r\nThis keeps the error mean at one and avoids bias in the ETS recursion.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "States that E(1 + ϵt) = 1 and gives all three restrictions correctly, with a reason consistent with the reference."}}, {"code": "Y99RH", "text": "All three are restricted so the multiplicative error has unit mean, E(1 + ϵt) = 1, keeping the model unbiased:\r\n\r\n- **Inverse Gaussian**: location μ = 1 (scale σ² free), so mean = μ = 1.\r\n- **Log-Normal**: location μ = −σ²/2, so mean = exp(μ + σ²/2) = 1.\r\n- **Gamma**: shape ξ = 1/σ², so mean = ξσ² = 1.\r\n\r\nThis unit-mean restriction is what allows these positive distributions to be applied directly to the multiplicative error of conventional ETS(M,*,*) models without log-transforming the model.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "The unit-mean requirement and all three restrictions are correct. Its closing remark on why the restriction matters differs from the reference's reason, but the reason is not required."}}]}, {"text": "What covariance matrix does the paper recommend estimating VETS with, and for what reasons?", "reference": "A diagonal covariance matrix (VETS D, assuming the errors of different series are uncorrelated) rather than a full one (VETS F). The authors' stated reason: it is easier to estimate, with far fewer parameters (n variances instead of n(n+1)/2 variances and covariances), especially on small samples. Supporting results on the M5 data: VETS D is more accurate than VETS F on both long and short histories, its coverage is closest to 95% on long data, and it has lower relative pinball values; VETS F gives intervals that are a little too wide and the highest pinball values, which the authors attribute to estimation difficulties. VETS F, however, had the lowest mean rank on long histories in the MCB test (not significant) and the best coverage in the space-planning evaluation on short histories.", "marking": "Required: a diagonal covariance matrix (VETS D) rather than a full one (VETS F), and the reason that it is easier to estimate, with fewer parameters (n variances rather than n(n+1)/2 variances and covariances), especially on small samples. Also correct: the supporting results on the M5 data (VETS D more accurate than VETS F on both history lengths, coverage closest to 95% on long histories, lower relative pinball values; VETS F intervals a little too wide, with the highest pinball values, attributed to estimation difficulties). Not required: the M5 results; that VETS F had the lowest mean rank on long histories in the MCB test (not significant) or the best coverage in the space-planning evaluation on short histories.", "answers": [{"code": "URKYF", "text": "**Recommendation:** A **diagonal** covariance matrix — i.e., VETS D, with errors uncorrelated across series — is recommended over the full covariance matrix (VETS F).\r\n\r\n**Reasons:**\r\n- **Accuracy:** VETS D has the lowest geometric mean and median rMAE of the five models on both long and short M5 histories.\r\n- **Interval calibration:** Its 95% prediction intervals have coverage closest to the nominal level on long histories.\r\n- **Estimability:** A diagonal covariance needs only n variance terms instead of n(n+1)/2, so it is easier to estimate — important with short histories and many series.\r\n- **VETS F's problems:** It over-covers (intervals too wide) and has the highest pinball losses of all five models on bo
