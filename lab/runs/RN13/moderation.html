er gives limitations from this list or says the authors state none. Wrong: presenting as the authors' a limitation not in this list (also overreach).", "answers": [{"code": "DX93X", "text": "The paper bases this on the M1/M3/tourism and M4 experiments, where auto.ces uses AIC to select between seasonal and non-seasonal CES and still performs well overall.\r\n\r\nThe paper does not state explicit limitations of that evidence, but it notes the seasonal model has many more parameters ($k = 4 + 2m + 3$), so AIC is needed to tell whether the added flexibility is worthwhile.", "judge": {"score": 0, "invented": 0, "overreach": 0, "reason": "Does not give the required result on the seasonal subset, where automatically selected CES beats every seasonal ETS model on RMSSE and MASE; it only says CES performs well overall. Saying the authors state no explicit limitations is acceptable."}}, {"code": "N4NV3", "text": "**Evidence:** On the seasonal subset (2,053 series), CES with seasonal/non-seasonal form chosen by AICc had lower RMSSE and MASE than every seasonal ETS model. The authors take this as showing the criterion picks the seasonal form when needed.\r\n\r\n**Limitations the paper itself states:**\r\n- The argument is from accuracy results only — no experiment compares AICc selection against other ways of choosing between seasonal and non-seasonal CES.\r\n- The parameter restrictions for seasonal CES stability are not derived (affecting [location]).\r\n- It assumes ETS model selection correctly identifies which series are seasonal (unchecked).", "judge": {"score": 0.5, "invented": 1, "overreach": 1, "reason": "Gives the required seasonal-subset result and two listed limitations. It also presents as the authors' a limitation not in the list (parameter restrictions for seasonal CES stability not derived), which the guide marks wrong and as overreach."}}]}, {"text": "When did the framework detect a change in the Royal Mail forecast errors, with which detectors, and what data urately than the damped trend model ETS(A,Ad,N) on non-seasonal series?", "reference": "No, not in general. On the 3,262 non-seasonal series, ETS(A,Ad,N) has lower mean RMSSE (2.502 vs 2.534), mean and median MASE (2.907 vs 2.949; 1.863 vs 1.880) and mean and median MSIS (3.769 vs 4.269; .854 vs .863); CES is better only on median RMSSE (1.654 vs 1.660). The authors state that CES lags behind the damped trend model on mean error measures and is second best in most cases.", "marking": "Required: no, not in general: the damped trend model ETS(A,Ad,N) is more accurate on most measures, including the mean error measures. Also correct: CES is better only on median RMSSE (1.654 against 1.660); CES is second best in most cases. Not required: the values (mean RMSSE 2.502 against 2.534, mean and median MASE 2.907 against 2.949 and 1.863 against 1.880, mean and median MSIS 3.769 against 4.269 and .854 against .863); the number of series (3,262). Wrong: saying CES beats all ETS models, or the damped trend model, on non-seasonal data (overreach).", "answers": [{"code": "AQ4VX", "text": "No. On the non-seasonal subset, ETS(A,Ad,N) has lower mean RMSSE (2.502 vs 2.534) and lower mean MASE (2.907 vs 2.949) than CES. CES is only close behind and remains second best on most measures.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says no, with the damped trend model better on the mean error measures and CES second best on most measures, consistent with the reference."}}, {"code": "74JWU", "text": "No — on the 3,262 non-seasonal series, **ETS(A,Ad,N) beats CES on almost every measure**:\r\n\r\n| Measure | CES | ETS(A,Ad,N) |\r\n|---|---|---|\r\n| RMSSE mean | 2.534 | **2.502** |\r\n| RMSSE median | **1.654** | 1.660 |\r\n| MASE mean | 2.949 | **2.907** |\r\n| MASE median | 1.880 | **1.863** |\r\n| MSIS mean | 4.269 | **3.769** |\r\n| MSIS median | 0.863 | **0.854** |\r\n\r\nCES wins only on **median RMSSE**; the damped trend model is better everywhere else.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says no, with ETS(A,Ad,N) better on every measure except median RMSSE; all values match the reference."}}]}, {"text": "How were the forecasting models trained and the detection thresholds set in the simulation study, and how many times was each scenario repeated?", "reference": "Each forecasting model is trained once on the first 300 observations and then produces one-step-ahead forecasts sequentially, without re-training. ARMA models are fitted with the forecast R package (Arima, auto.arima) and ETS models with es() from the smooth R package. Changes are signalled using the theoretical thresholds of the authors' limit theorems with γ = 0 and a false alarm rate of 0.05. For the Raw CUSUM the standard deviation in the threshold is a Bartlett long-run variance estimate (sandwich package); for the forecast errors, assumed i.i.d., the ordinary standard deviation is used. Each scenario is repeated 1,000 times, with normally distributed innovations unless stated otherwise.", "marking": "Required: a training sample of 300 observations; the theoretical thresholds with a false alarm rate of 0.05; 1,000 repetitions of each scenario. Also correct: the models are trained once and not re-trained, then produce one-step-ahead forecasts sequentially; ARMA models fitted with the forecast R package (Arima, auto.arima) and ETS models with es() from the smooth R package; γ = 0; for the Raw CUSUM a Bartlett long-run variance estimate (sandwich package), for the forecast errors, assumed i.i.d., the ordinary standard deviation; normally distributed innovations unless stated otherwise. Not required: any of the details listed under Also correct.", "answers": [{"code": "QKNUY", "text": "Models were trained on an initial segment of n_train = 300 observations, then produced sequential one-step-ahead forecasts. ARMA models were selected/estimated via auto.arima (forecast package) and ETS via es (smooth package). Thresholds were theoretical, from [location] (Supporting Information), with γ = 0 and false alarm rate 0.05; for Raw CUSUM, σ̂ was the Bartlett long-run variance estimator, while forecast-error detectors used the standard i.i.d. estimator. Each scenario was repeated 1,000 times.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Gives the 300-observation training sample, theoretical thresholds with false alarm rate 0.05 and 1,000 repetitions; the extra details (packages, γ = 0, Bartlett estimator) match the reference."}}, {"code": "HX4YW", "text": "**Training:** Models were trained once on the first n_train = 300 observations, then produced one-step-ahead forecasts sequentially without retraining.\r\n\r\n**Thresholds:** Theoretical Page's CUSUM thresholds with γ = 0 and false alarm rate α = 0.05; for ARMA/ETS error detectors the standard deviation was the traditional estimator treating errors as i.i.d., while Raw CUSUM used the Bartlett long-run variance estimator.\r\n\r\n**Repetitions:** Each scenario was repeated **1000 times**.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "All three required elements are present (300 training observations, theoretical thresholds at 0.05, 1,000 repetitions), and the added details agree with the reference."}}]}, {"text": "In simulation experiment 2, which approach had the lowest mean scaled pinball score for each data generating process?", "reference": "Akram's approach (ETS(A,Ad,A) on the logarithms of the data) on every one of the five data generating processes: 5.110 on Normal, 5.052 on Inverse Gaussian, 5.074 on Gamma, 9.180 on Log-Normal and 5.089 on Akram's data.", "marking": "Required: Akram's approach (ETS(A,Ad,A) on the logarithms of the data) for all five data generating processes. Not required: the score values. Wrong: any other approach named as lowest for any process.", "answers": [{"code": "EAV3H", "text": "Akram’s approach had the lowest mean scaled pinball score for every DGP.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Correctly names Akram's approach as lowest for every data generating process; the values are not required."}}, {"code": "KNP4C", "text": "Akram's log-ETS model had the lowest mean SPS for every DGP:\r\n\r\n| DGP | Lowest SPS | Akram's SPS |\r\n|---|---|---|\r\n| Normal | Akram | 5.110 |\r\n| Inverse Gaussian | Akram | 5.052 |\r\n| Gamma | Akram | 5.074 |\r\n| Log-Normal | Akram | 9.180 |\r\n| Akram | Akram | 5.089 |\r\n\r\nThe AICc-selected multiplicative model was second-best in most cases.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Names Akram's log-ETS approach as lowest for all five data generating processes, with values matching the reference. The remark about the second-best model is extra and cannot be checked against the guide."}}]}, {"text": "On what does the paper base its view that the AR(1) estimates from GTMSE, MSCE and GPL on the temperature data are realistic?", "reference": "Climatologists argue that the AR(1) parameter should be positive. The GTMSE, MSCE and GPL estimates (0.691, 0.634, 0.532) are similar to those found by others in the field (Hartmann et al. 2013; Cahill et al. 2015; Rahmstorf et al. 2017), whereas MSE_h shrinks it to −0.786, which the authors call unrealistic. The authors conclude that the shrinkage is beneficial compared with the model estimated by MSE.", "marking": "Required: climatologists expect the AR(1) parameter to be positive; the GTMSE, MSCE and GPL estimates are positive and similar to those of earlier climate studies, whereas MSE_h gives a negative estimate. Also correct: adding that the conventional MSE also gives a positive AR(1) estimate (0.558), close to GPL's. Not required: the cited studies by name; the estimates' values.", "answers": [{"code": "YATKW", "text": "The [location]: those estimates are positive (0.691, 0.634, 0.532), matching climatologists' expectation of a positive AR(1) parameter for temperature series, and similar to values reported in the climate literature (Hartmann et al. 2013; Cahill et al. 2015; Rahmstorf et al. 2017). By contrast, MSE_h's estimate was −0.786, which the authors read as unrealistic over-shrinkage.\r\n\r\nCaveats the paper itself notes: the comparison is qualitative, based on a single series, and MSE₁'s estimate (0.558) is also positive.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Covers climatologists' expectation of a positive AR(1) parameter, the similarity to earlier climate studies and the negative MSE_h estimate; the added note that conventional MSE gives 0.558 is also correct."}}, {"code": "TTXRR", "text": "The paper bases this on consistency with published estimates in the climate literature — specifically Hartmann et al. (2013), Cahill et al. (2015), and Rahmstorf et al. (2017) — whose AR(1) estimates for global temperature data are similar to those produced by GTMSE, MSCE and GPL (around 0.53–0.69), unlike MSE_h's −0.786.", "judge": {"score": 0.5, "invented": 0, "overreach": 0, "reason": "Gives the similarity to published climate estimates and the contrast with MSE_h's −0.786, but omits the required point that climatologists expect the AR(1) parameter to be positive."}}]}, {"text": "What were the mean MASE and RMSSE of CES on the 414 hourly series of the M4 competition?", "reference": null, "marking": "Required: says the authors do not report this (any wording). Wrong: giving an answer as the authors'.", "answers": [{"code": "WF3D7", "text": "The paper doesn't break accuracy down by M4 frequency — [location] reports only overall means/medians across all 99,990 series. No per-frequency (hourly, daily, etc.) results are given.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says no per-frequency results are given and offers no figures as the authors'."}}, {"code": "FYPP9", "text": "The paper does not report M4 results broken down by frequency, so mean MASE and RMSSE for the 414 hourly series are not given.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says the paper does not give MASE and RMSSE for the hourly series, as required on this absent question."}}]}, {"text": "In which cases does the conventional point forecast of a pure multiplicative ETS model coincide with its conditional geometric and arithmetic expectations?", "reference": "Only in three cases: for h = 1 in all models; for h ≤ m in non-trended models with multiplicative seasonality; and for the ETS(M,N,N) model.", "marking": "Required: all three cases: h = 1 in all models; h ≤ m in non-trended models with multiplicative seasonality; the ETS(M,N,N) model. Wrong: a missing case, or a case not in this list presented as one of them.", "answers": [{"code": "77FPR", "text": "Per [location], the conventional point forecast equals both conditional expectations only in three cases:\r\n\r\n1. **One-step-ahead forecasts** (h = 1)\r\n2. **Within the first seasonal cycle** (h ≤ m) for non-trended models with multiplicative seasonality\r\n3. **ETS(M,N,N)** — the level-only model, for any horizon\r\n\r\nIn all other cases (h > 1 with trend, or h > m with seasonality), the point forecast lies below the geometric mean, which lies below the arithmetic mean.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Lists all three required cases: h = 1, h ≤ m for non-trended models with multiplicative seasonality, and ETS(M,N,N). The closing remark on other cases is extra detail outside the guide."}}, {"code": "WKWKA", "text": "The paper gives three cases:\r\n\r\n1. One-step-ahead forecasts, h = 1, for all pure multiplicative ETS models.\r\n2. Horizons h ≤ m for non-trended models with multiplicative seasonality.\r\n3. The special model ETS(M,N,N), for any horizon h.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Lists all three required cases correctly and adds none outside the list."}}]}, {"text": "How much longer did computing the conditional expectation by simulation take than computing the conventional point forecast?", "reference": null, "marking": "Required: says the authors do not report this (any wording). Wrong: giving an answer as the authors'. A nearby statement, that the conditional expectation should be obtained by simulation, does not answer it.", "answers": [{"code": "9VMAX", "text": "The paper does not report a timing comparison, so I can’t quantify it from the text.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says the paper does not report a timing comparison and gives no figure as the authors'."}}, {"code": "KRDX9", "text": "The paper doesn't report computation times. It only documents that conditional expectations require Monte Carlo simulation and that the M3 example used simulation to obtain them — no runtime comparison is given.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says the paper reports no computation times or runtime comparison, which is what the marking guide requires on this absent question."}}]}, {"text": "What values of the level and seasonal smoothing parameters did VETS D estimate for the seasonal groups of the M5 data?", "reference": null, "marking": "Required: says the authors do not report this (any wording). Wrong: giving an answer as the authors'. The simulation settings (α = 0.3, γ = 0.1 and the ranges of the smoothing parameters used to generate simulated data) are not estimates on the M5 data and do not answer it.", "answers": [{"code": "DXTCX", "text": "The paper does not report the estimated values of the smoothing parameters for the M5 data. It reports only which PIC restrictions the selection procedure chose (most often PIC(LS,S,N) — common level and seasonal smoothing parameters, common initial seasonal indices, individual components), not the numerical estimates of α and γ.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says the paper does not report the estimated smoothing parameter values for the M5 data and does not offer the simulation settings as an answer."}}, {"code": "MJRKR", "text": "The paper does not report the estimated smoothing parameter values. It only reports which PIC restrictions were selected and the resulting forecast accuracy/interval measures — not the actual α, γ, etc. estimates for the M5 groups.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Says the paper does not report the estimated smoothing parameter values for the M5 groups."}}]}, {"text": "What coverage did the 95% prediction intervals of each model reach on the long M5 histories (51 observations for estimation)?", "reference": "Long histories: ETS LN 0.934, ETS (ADAM) 0.925, ETS 0.937, VETS D 0.947, VETS F 0.982. The three ETS models are below 95%; VETS F is a little too wide; VETS D is closest to 95%.", "marking": "Required: VETS D 0.947 and VETS F 0.982, and that the three ETS models fall short of 95%. Also correct: the ETS values (ETS LN 0.934, ETS (ADAM) 0.925, ETS 0.937); VETS F is a little too wide; VETS D is closest to 95%. Not required: values for the short histories (not wrong either). Wrong: other values for the long histories.", "answers": [{"code": "U7PAT", "text": "Coverage on long M5 histories (51 estimation observations, 12-month holdout), nominal 95%:\r\n\r\n| Model | Coverage |\r\n|---|---|\r\n| ETS LN | 0.934 |\r\n| ETS (ADAM) | 0.925 |\r\n| ETS | 0.937 |\r\n| VETS D | 0.947 |\r\n| VETS F | 0.982 |\r\n\r\nAll univariate ETS variants fell below the nominal 95%. VETS D came closest (0.947), while VETS F overshot with intervals that were too wide (0.982).", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "All five coverage values are correct, with ETS models below 95%, VETS D closest and VETS F too wide."}}, {"code": "HDEUJ", "text": "From [location] (long histories):\r\n\r\n- VETS F: 0.982\r\n- VETS D: 0.947\r\n- ETS LN: 0.934\r\n- ETS (ADAM): 0.925\r\n- ETS: 0.937\r\n\r\nNominal level: 0.95. VETS F over-covers; VETS D is closest to nominal.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "All five coverage values are correct and the nominal 0.95 is stated, which shows the three ETS models below it; VETS F over-covers and VETS D is closest."}}]}, {"text": "On short M5 histories, are the prediction intervals of VETS D better than those of the univariate ETS models?", "reference": "In coverage yes: 0.970 against 0.815–0.886 for the ETS models. In relative pinball no: VETS D has higher upper and lower pinball values than all three ETS models (e.g. upper 2.515). The authors therefore do not recommend VETS when the pinball measure matters most and the history is short.", "marking": "Required: separates the two measures: in coverage yes (VETS D 0.970 against 0.815 to 0.886 for the ETS models); in relative pinball no (VETS D has higher upper and lower pinball values than all three ETS models). Not required: the values; that the authors do not recommend VETS when pinball matters most and the history is short. Wrong (overreach): saying VETS D has better intervals without separating coverage and pinball.", "answers": [{"code": "MDCQP", "text": "No. On short histories, VETS D has higher rPinballU and rPinballL than all three ETS models (rPinballU 2.515 vs 0.938–1.155; rPinballL 1.567 vs 0.895–1.194). Its coverage (0.970) is close to nominal, but its intervals are wider/less sharp than ETS's. Hence the recommendation [location]: VETS D over ETS except when pinball values matter most and the history is short.", "judge": {"score": 0.5, "invented": 0, "overreach": 0, "reason": "Correct on pinball, with the right values, and mentions the 0.970 coverage. But it answers a flat 'No' and never says VETS D is better than the ETS models on coverage, so the coverage half is incomplete."}}, {"code": "PC9D7", "text": "Mixed — it depends on the metric:\r\n\r\n- **Coverage:** Yes. VETS D achieves 0.938 coverage on short data, close to the nominal 95% and better than ETS LN (0.826), ETS (ADAM) (0.870) and ETS (0.870), which all fall well below 95%.\r\n- **Pinball values:** No. On short data, VETS D has worse relative pinball values than the ETS models (e.g. pinballU 1.567 for VETS D vs 0.895–1.194 for ETS variants), meaning its intervals are wider/less sharp.\r\n\r\nSo VETS D intervals are better calibrated (coverage) but less sharp (higher pinball) than univariate ETS on short histories.", "judge": {"score": 0.5, "invented": 1, "overreach": 0, "reason": "Separates coverage (yes) from pinball (no) correctly. But it gives wrong values as the paper's: coverage 0.938 instead of 0.970, ETS coverages outside 0.815–0.886, and upper pinball 1.567 instead of 2.515."}}]}, {"text": "Why does the paper say that the Log-Normal distribution should be used with care in ETS(M,*,*) models?", "reference": "Because of the restriction μ = −σ²/2, the maximum likelihood estimate of the scale comes from an equation with two roots: the derivative of the log-likelihood has two roots, so the likelihood is not convex, which may violate the identification and compactness assumptions and make the estimates inconsistent. The closed-form estimate also exists only when the mean of log²(1 + ϵt) is at most 1; otherwise the scale must be found by numerical optimisation.", "marking": "Required: the likelihood is not convex (because of the restriction μ = −σ²/2), which may make the estimates inconsistent. Also correct, as equal alternatives for the scale estimate: either that its formula has two roots and exists in closed form only when the mean of log²(1 + ϵt) is at most 1 (otherwise numerical optimisation is needed), or that the scale is given by a corrected formula rather than the quadratic root formula. Not required: the two roots, the ≤ 1 condition, the identification and compactness assumptions. Wrong: omitting the non-convex likelihood.", "answers": [{"code": "RUKWH", "text": "Per [location]: under the unit-mean restriction (μ = −σ²/2), the concentrated log-likelihood is **non-convex**, creating potential local optima during numerical optimisation, and the MLE of σ² exists only in some cases — the paper references a corrected formula superseding the erroneous closed-form root printed in the 2023 article.", "judge": {"score": 0.5, "invented": 0, "overreach": 0, "reason": "Gives the non-convex likelihood under μ = −σ²/2 and the corrected scale formula, but gives local optima as the consequence and omits that the estimates may be inconsistent."}}, {"code": "KDK3F", "text": "Because its scale estimate has issues: the closed-form MLE only exists if the mean squared log-error is ≤ 1, otherwise numerical optimization is needed. It also gives two roots, and the likelihood is not convex, which can make parameter estimates potentially inconsistent.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Gives the non-convex likelihood and possible inconsistency of the estimates, plus the two roots and the ≤ 1 condition for the closed-form scale estimate."}}]}, {"text": "On the M5 data, which model had the lowest overall geometric mean and median rMAE (relative to Naïve forecasts), with long and with short histories?", "reference": "VETS D on both measures and both lengths. Long: geometric mean 0.894 and median 0.934, against 0.906 and 0.960 for VETS F and at least 0.917 and 0.957 for the ETS models. Short: 0.936 and 0.974, against 1.011 and 1.000 for VETS F and at least 0.991 and 0.988 for the ETS models.", "marking": "Required: VETS D, for both long and short histories and on both the geometric mean and the median of rMAE over all series. Not required: the values. Wrong: another model for either history length or either measure; an answer taken from the seasonal or non-seasonal series alone instead of all series.", "answers": [{"code": "73VP3", "text": "**Long histories:** VETS D — geometric mean 0.894, median 0.934.\r\n\r\n**Short histories:** VETS D — geometric mean 0.936, median 0.974.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Names VETS D for both history lengths on both measures, with values matching the reference."}}, {"code": "NDNKN", "text": "**Long history (51 obs):**\r\n- Geometric mean: **VETS D** (0.894)\r\n- Median: **VETS D** (0.878)\r\n\r\n**Short history (24 obs):**\r\n- Geometric mean: **VETS D** (0.979)\r\n- Median: **VETS D** (0.974)\r\n\r\nSo **VETS D** (diagonal covariance) had both the lowest geometric mean and median rMAE in both cases.", "judge": {"score": 0.5, "invented": 1, "overreach": 0, "reason": "Names VETS D correctly in all four cases, but gives a wrong long-history median (0.878 instead of 0.934) and a wrong short-history geometric mean (0.979 instead of 0.936). Those figures are presented as the paper's overall results, so invented is set."}}]}, {"text": "What happens to an ARIMA(1,1,1) model estimated with a multi-step loss function as the forecast horizon grows?", "reference": "Both φ̂1 and θ̂1 tend to −1, and the model degenerates: (1 − B)(1 + B)y_t = (1 − B)e_t reduces to (1 + B)y_t = e_t, an ARIMA(1,0,0) model.", "marking": "Required: φ̂1 and θ̂1 both tend to −1 and the model degenerates into an ARIMA(1,0,0) model. Also correct: adding, alongside the authors' statement, that the minimum is instead at φ̂1 = 0, θ̂1 = −1 (a deterministic level). Not required: the equations.", "answers": [{"code": "JAURM", "text": "As the forecast horizon grows, the parameters shrink: φ̂₁ → −1 and θ̂₁ → −1. The model degenerates into a restricted ARIMA(1,0,0), i.e., (1+B)y_t = e_t — a deterministic, non-stochastic model.", "judge": {"score": 0.5, "invented": 1, "overreach": 0, "reason": "Correctly states that both parameters tend to -1 and the model degenerates into ARIMA(1,0,0). It then calls the resulting model deterministic and non-stochastic, which the reference does not support and which contradicts the equation it gives, (1+B)y_t = e_t."}}, {"code": "MA3U4", "text": "According to the paper's [location]: as the horizon \\(h\\) grows, the AR parameter \\(\\hat{\\phi}_1\\) and MA parameter \\(\\hat{\\theta}_1\\) are tly says no: CES is formulated with an additive error only and a multiplicative-error version is not developed."}}]}, {"text": "What supports the claim that mean and variance changes in the raw data show up as a mean change in the centred squared forecast errors, and under what conditions?", "reference": "Proposition 1, proved from the definition of the forecast errors: under Assumption 1 the change size is Var_G′[Y_t] − Var_F[Y_t] when the mean does not change, plus Δ²_μ,m when it does and Assumption 2 holds. Proposition 2 and Corollary 1 then give the limiting distributions of the detector, provided the change size satisfies Assumptions C–E (large enough). For ARMA models the result agrees with Aue et al. (2015), where a variance change of size δ gives a change of δ in the squared errors.", "marking": "Required: mentions the assumptions on the forecasting model (a constant forecast bias before the change; for a mean change, that the model does not fully adjust to it). Also correct: Proposition 1, derived from the definition of the forecast errors: the change size is Var_G′[Y_t] − Var_F[Y_t] when the mean does not change, plus Δ²_μ,m when it does; Proposition 2 and Corollary 1 give the detector's limiting distributions when the change size is large enough (Assumptions C–E); for ARMA models a variance change of size δ gives a change of δ in the squared errors, in agreement with Aue et al. (2015); the derivation written with G′ or with G after the change, and with +δ_μ,m or −δ_μ,m in its intermediate step; adding that the limit distribution under a variance change is disputed, or that the change equals the variance change only if the forecast bias stays constant and the conditional variances are constant. Not required: the items listed under Also correct.", "answers": [{"code": "Q3JEF", "text": "**Support:** formal proof [location] ([location] of the paper), which derives the change size from the two forecasting-model assumptions ([location] constant bias, [location] s only to static regressions without dynamic state transitions; it does not transfer to dynamic regression models with AR or MA error structures.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Answers no because the persistence vector is zero in a static regression; the caveat about regressions with dynamic errors is accepted by the guide."}}, {"code": "9HWKT", "text": "No. The paper states that regression has no dynamic elements — its persistence vector g is zero, so all c_j = 0 and the multi-step variance equals the one-step variance. Hence no shrinkage is imposed on regression coefficients; this shrinkage is a univariate time-series phenomenon.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Answers no because a regression has no dynamic elements (zero persistence vector), so no shrinkage is imposed on its coefficients."}}]}, {"text": "According to the paper, what explains the Raw CUSUM's results in the scenarios with a change in the autoregressive parameter?", "reference": "The Raw CUSUM does not take the seasonality into account, so the variance is overestimated in the Phase I (training) period, and a larger variance estimate makes changes much harder to detect.", "marking": "Required: the Raw CUSUM does not take the seasonality into account, so it overestimates the variance in the training (Phase I) period, and a larger variance estimate makes changes much harder to detect.", "answers": [{"code": "J9FJX", "text": "The paper's explanation (explaining [location]) is that the Raw CUSUM monitors the raw data without modelling their quarterly seasonality (quarter means −2, 5, 7, −10). Its Phase I variance estimate therefore includes the seasonal variation and is too large; since the threshold grows with that estimate, a change must be larger to be detected. The ARMA/ETS forecasting models capture the seasonality, so their forecast errors do not carry it and detection is better. The paper gives this as the reason but does not report the variance estimates themselves.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "States that the Raw CUSUM ignores seasonality, so the Phase I variance estimate is too large and changes are harder to detect, as required. The added detail is consistent with the reference."}}, {"code": "WWMAK", "text": "The Raw CUSUM doesn't account for seasonality, so it overestimates the variance during Phase I training; a larger variance estimate makes changes harder to detect, hurting its detection probability and delay.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Covers all required elements: seasonality not accounted for, variance overestimated in Phase I, and changes therefore harder to detect."}}]}, {"text": "On the M1, M3 and tourism competition data, what were the mean and median RMSSE of CES, and how did they compare with ETS, ARIMA and the Theta method?", "reference": "Over the 5,315 series of the M1, M3 and tourism data, CES had mean RMSSE 1.959 and median RMSSE 1.170, the lowest of the univariate models: ETS 1.970 and 1.181, ARIMA 2.134 and 1.271, Theta 1.965 and 1.238. The combination SCUM was lower still (1.867 and 1.128).", "marking": "Required: CES had mean RMSSE 1.959 and median RMSSE 1.170, the lowest of CES, ETS, ARIMA and the Theta method on both. Not required: the values of ETS (1.970, 1.181), ARIMA (2.134, 1.271), Theta (1.965, 1.238) and SCUM (1.867, 1.128); the number of series (5,315). Wrong: saying CES beat the SCUM combination, whose mean and median RMSSE are lower.", "answers": [{"code": "PWQ3H", "text": "On M1/M3/tourism, CES had mean RMSSE 1.959 and median RMSSE 1.170.\r\n\r\nComparison:\r\n- ETS: mean 1.970, median 1.181 — slightly worse than CES.\r\n- ARIMA: mean 2.134, median 1.271 — worse than CES.\r\n- Theta: mean 1.965, median 1.238 — slightly worse than CES.\r\n\r\nSo CES had the lowest mean and median RMSSE among these four.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Gives CES edian MSIS (0.869 and 0.592) but highest mean on M1/M3/tourism (3.465) and not the lowest mean on M4 (2.379 against 2.272 for ARIMA)."}}]}, {"text": "In the space-planning evaluation on the M5 data (forecasts 3, 6 and 12 months ahead), at which of these horizons does either VETS model have the lowest GMRAE of the five models, with long and with short histories?", "reference": "Long histories: at none; a univariate ETS model is lowest at every horizon (ETS (ADAM) 0.716 at 3 months, ETS 0.827 at 6 and 0.939 at 12). Short histories: at 3 months (VETS D 1.037) and 12 months (VETS F 0.872), but not at 6 months, where ETS (0.946) is lower than both VETS models. The authors say the VETS models do much better on short histories.", "marking": "Required: long histories: at no horizon, a univariate ETS model is lowest at each of 3, 6 and 12 months; short histories: a VETS model is lowest at 3 months (VETS D) and 12 months (VETS F) but not at 6 months, where ETS is lowest. Not required: the values; that the authors say the VETS models do much better on short histories. Wrong (overreach): a VETS model lowest at every horizon on short histories, or at any horizon on long histories.", "answers": [{"code": "XQCQF", "text": "From [location]:\r\n\r\n**Long histories (51 obs. estimation):** Neither VETS model has the lowest GMRAE at any horizon — ETS (ADAM) is lowest at 3 and 12 months (0.716, 0.988), ETS at 6 months (0.827).\r\n\r\n**Short histories (24 obs. estimation):** VETS D is lowest at 3 months (1.037) and 12 months (0.938); at 6 months ETS is lowest (0.946).", "judge": {"score": 0.5, "invented": 1, "overreach": 0, "reason": "The horizons are right: none on long histories, 3 and 12 months but not 6 on short. But it attributes the 12-month short-history win to VETS D (0.938) instead of VETS F (0.872), and gives ETS (ADAM) 0.988 as the long-history 12-month lowest instead of ETS 0.939, so wrong values are presented as the paper's."}}, {"code": "XAPJA", "text": "**Long history:** ions of this evidence does the paper itself state?", "reference": "A derivation shows that the point forecast is at most the conditional geometric expectation, which is at most the arithmetic expectation (by Jensen's inequality). An example with ETS(M,M,N) on M3 series N2703 shows the difference growing exponentially with the horizon, and simulation experiment 1 shows it increasing with all five factors studied. Limits stated by the authors: the regression in simulation experiment 1 only shows the direction and relative size of the effects; its specific coefficient values are difficult to interpret.", "marking": "Required: the derivation (the point forecast is at most the conditional geometric expectation, which is at most the arithmetic expectation, by Jensen's inequality) and at least one of the two examples: ETS(M,M,N) on one M3 series, where the difference grows exponentially with the horizon; or simulation experiment 1, where it increases with all five factors studied. Not required: naming the M3 series; giving limitations. Acceptable limitations: the regression in simulation experiment 1 shows only the direction and relative size of the effects, and its coefficient values are difficult to interpret; simulation experiment 1 uses only ETS(M,Md,N) with Inverse Gaussian errors and known true parameters; conditional expectations of pure multiplicative models other than ETS(M,N,N) have no closed form and must be obtained by simulation. Limitations: correct if the answer gives limitations from this list or says the authors state none. Wrong: presenting as the authors' a limitation not in this list (also overreach).", "answers": [{"code": "WKRQ9", "text": "Evidence:\r\n- Theory: point forecasts, geometric means, and arithmetic conditional expectations generally differ in pure multiplicative ETS.\r\n- Example: M3 series N2703 with ETS(M,M,N) shows the gap grows exponentially with horizon.\r\n- Simulation: regression on 10,000 runs finds bias increases with φ, β, σ, and horizon.\r\n\r\nLimitations:\r\n- Simulation uses one model class, ETS(M,Md,N), with Inverse Gaussian errors.\r\n- It studies bias mechanism, not predictive accuracy or best forecasting method.\r\n- Results are simulation-based, not a general proof for all ETS(M,*,*) models.", "judge": {"score": 0.5, "invented": 1, "overreach": 1, "reason": "Both examples are given, but the derivation is only vaguely stated, with no ordering of the three quantities or Jensen's inequality. Two limitations (bias mechanism rather than accuracy; not a general proof) are presented as the authors' but are not in the acceptable list."}}, {"code": "JHAJH", "text": "**Evidence:**\r\n\r\n1. **Formal proof:** In logarithmic state space form, the conventional point forecast equals the conditional *geometric* mean. By Jensen's inequality, it is generally below the arithmetic conditional expectation: ŷ ≤ ỹ ≤ μ. Equality holds only at h = 1, within the first seasonal cycle for non-trended seasonal models, or for ETS(M,N,N).\r\n\r\n2. **Simulation:** 10,000 ETS(M,Md,N) series with IG errors show the percentage difference between expectation and point forecast grows with φ, horizon, β, σ, and α (R² = 0.986) — non-negligible and substantial.\r\n\r\n3. **Empirical example:** On M3 series N2703 with ETS(M,M,N), the gap is negligible at short horizons but grows exponentially up to 18 steps — contradicting Hyndman et al. (2008), who called the difference \"negligible.\"\r\n\r\n**Stated limitations:**\r\n\r\n- No closed-form conditional expectations exist for models other than ETS(M,N,N); Monte Carlo simulation is required.\r\n- Simulation 1 covers only ETS(M,Md,N) with IG errors and known true parameters.\r\n- **[location] scope:** The empirical evidence is a single series with horizons of only 1–18 steps.", "judge": {"score": 0.5, "invented": 1, "overreach": 1, "reason": "The derivation via Jensen's inequality and both examples are correct, and two limitations are acceptable. The third limitation (a single series with horizons of only 1-18) is presented as the authors' but is not in the acceptable list."}}]}, {"text": "How was simulation experiment 1 set up?", "reference": "Series of 100 observations were generated from ETS(M,Md,N) with an Inverse Gaussian error distribution (sim.es() from smooth 3.2.0), and the same model with the known parameters was applied to produce point forecasts and conditional expectations. The grid was σ ∈ {0.01, 0.05, 0.1, 0.5, 1}, α, β ∈ {0.1, 0.2, 0.5}, φ ∈ {0.5, 0.9, 0.95, 1} and h ∈ {10, 50, 100}, with 10,000 iterations. The percentage difference between the conditional expectation and the point forecast was aggregated over the horizon and regressed on the scaled variables (a Box-Cox transformed odds regression with alm() from greybox).", "marking": "Required: ETS(M,Md,N) as the generating and applied model, the Inverse Gaussian error distribution, the known (true) parameters used for forecasting, and the varied factors (σ, α, β, φ and the horizon h). Not required: the exact grid values, the series length, the number of iterations, the software and the regression used to summarise the results; giving them correctly is also correct.", "answers": [{"code": "7EKPK", "text": "**Setup:**\r\n- 10,000 iterations of 100-observation series simulated from ETS(M,Md,N) (damped multiplicative trend, no seasonality) with Inverse Gaussian errors, using `smooth::sim.es`\r\n\r\n**Parameter grids:**\r\n- σ ∈ {0.01, 0.05, 0.1, 0.5, 1}\r\n- α, β ∈ {0.1, 0.2, 0.5}\r\n- φ ∈ {0.5, 0.9, 0.95, 1}\r\n- Horizons h ∈ {10, 50, 100}\r\n\r\n**Procedure:** For each simulated series, the percentage difference (PD) between the conditional expectation and the conventional point forecast was computed, transformed to odds PD/(1−PD), then Box-Cox transformed (λ = 0.146) and regressed on scaled parameters (σ, horizon, α, β, φ) via `greybox::alm` with a Box-Cox Normal distribution.\r\n\r\n**Limitation:** Only ETS(M,Md,N) with IG errors and known true parameters was evaluated.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Gives ETS(M,Md,N), Inverse Gaussian errors, known true parameters and the varied factors σ, α, β, φ and h, with a grid matching the reference."}}, {"code": "Y4W3F", "text": "They simulated 10,000 series of 100 observations from an ETS(M,Md,N) DGP with Inverse Gaussian errors, using known parameters, then applied the same model to produce point forecasts and simulated conditional expectations. They measured percentage difference PD = (μₜ₊ₕ − ŷₜ₊ₕ)/μₜ₊ₕ, aggregated over horizons, and regressed it on σ, α, β, horizon, and φ. Factors varied: σ ∈ {0.01, 0.05, 0.1, 0.5, 1}, α, β ∈ {0.1, 0.2, 0.5}, h ∈ {10, 50, 100}, φ ∈ {0.5, 0.9, 0.95, 1}.", "judge": {"score": 1, "invented": 0, "overreach": 0, "reason": "Gives ETS(M,Md,N) as generating and applied model, Inverse Gaussian errors, known parameters and the varied factors, with correct grid values."}}]}]};
const KEY = "moderation:" + DATA.sheet;
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { state = {}; }
const el = (t, a = {}, ...kids) => { const e = document.createElement(t); for (const k in a) { if (k === "text") e.textContent = a[k]; else e.setAttribute(k, a[k]); } kids.forEach(c => e.appendChild(c)); return e; };
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} progress(); }
function progress() {
  const n = DATA.items.reduce((s, q) => s + q.answers.length, 0);
  const d = Object.values(state).filter(s => s.approved || (s.reason || "").trim()).length;
  document.getElementById("progress").textContent = d + " of " + n + " done";
}
function card(a) {
  const s = state[a.code] || (state[a.code] = {score: a.judge.score, invented: a.judge.invented, overreach: a.judge.overreach, reason: "", approved: false});
  const box = el("div", {class: "a"});
  const mark = () => { const changed = s.score !== a.judge.score || s.invented !== a.judge.invented || s.overreach !== a.judge.overreach;
    s.changed = changed; if (changed) s.approved = false; appr.checked = s.approved;
    box.className = "a" + (changed ? " changed" : "") + (s.approved || (changed && s.reason.trim()) ? " done" : ""); save(); };
  const sel = el("select");
  [["1", "1"], ["0.5", "½"], ["0", "0"]].forEach(([v, t]) => { const o = el("option", {value: v, text: t}); if (Number(v) === s.score) o.selected = true; sel.appendChild(o); });
  sel.onchange = () => { s.score = Number(sel.value); mark(); };
  const box1 = el("input", {type: "checkbox"}); box1.checked = !!s.invented; box1.onchange = () => { s.invented = box1.checked ? 1 : 0; mark(); };
  const box2 = el("input", {type: "checkbox"}); box2.checked = !!s.overreach; box2.onchange = () => { s.overreach = box2.checked ? 1 : 0; mark(); };
  const appr = el("input", {type: "checkbox"}); appr.checked = s.approved; appr.onchange = () => { if (appr.checked) { s.score = a.judge.score; s.invented = a.judge.invented; s.overreach = a.judge.overreach; sel.value = String(s.score); box1.checked = !!s.invented; box2.checked = !!s.overreach; } s.approved = appr.checked; mark(); };
  const why = el("textarea", {placeholder: "Reason (needed when you change the grade or a flag)"}); why.value = s.reason; why.oninput = () => { s.reason = why.value; mark(); };
  box.append(el("div", {class: "lab", text: "Answer " + a.code}), el("pre", {text: a.text}),
    el("div", {class: "judge", text: "Judge: score " + a.judge.score + ", invented " + a.judge.invented + ", overreach " + a.judge.overreach + ". " + a.judge.reason}),
    el("div", {class: "row"}, el("label", {}, appr, document.createTextNode(" Approve")), el("label", {text: "Score "}), sel,
      el("label", {}, document.createTextNode("  "), box1, document.createTextNode(" invented")), el("label", {}, box2, document.createTextNode(" overreach"))),
    why);
  mark();
  return box;
}
const root = document.getElementById("items");
DATA.items.forEach((q, i) => {

});
document.getElementById("save").onclick = () => {

  const link = el("a", {href: url, download: "moderation.json"}); document.body.appendChild(link); link.click(); link.remove();
};
progress();
